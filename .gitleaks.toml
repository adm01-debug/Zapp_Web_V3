[[rules]]
id = "supabase-jwt"
description = "Supabase JWT key"
regex = "eyJhbG[^\"]*VCJ9"
keywords = ["eyJhbGci"]

[[rules]]
id = "github-pat"
description = "GitHub PAT"
regex = "ghp_[A-Za-z0-9]{36,}"
keywords = ["ghp_"]

[[rules]]
id = "postgres-connstring"
description = "PostgreSQL connection string with password"
regex = '''postgres(?:ql)?://([^:]+):([^@]+)@([^/\s]+)'''
secretGroup = 2
entropy = 3.5

[[rules]]
id = "jwt-generic"
description = "Generic JWT (header.payload.signature)"
regex = '''(eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})'''
secretGroup = 1

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
keywords = ["AKIA"]
