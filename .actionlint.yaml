self-hosted-runner:
  labels:
    - Linux
    - X64
    - vps-zapp

shellcheck-disable:
  - SC2086  # info: unquoted $VAR — prevalece em $GITHUB_OUTPUT (legado pré-etapa 82)
  - SC2129  # style: multiple redirects to same file — prevalece em blocks pré-etapa 82
  - SC2016  # info: single quotes in node -e JS args — false positives (JS, não shell)
  - SC2126  # style: grep -c; use wc -l — padrão legado em scripts de CI
  - SC2162  # info: read without -r — legado pré-etapa 82
  - SC2012  # info: use find instead of ls — padrão legado em scripts de CI
  - SC2015  # info: use || { cmd; } — padrão legado em scripts de CI
  - SC2116  # info: useless echo — padrão legado em scripts de CI
  - SC2002  # style: useless cat — padrão legado em scripts de CI
  - SC2001  # style: use parameter expansion instead of sed — padrão legado
  - SC2013  # info: use while read instead of for — padrão legado em scripts de CI
  - SC2034  # warning: unused variable — variáveis de controle de retry em loops
