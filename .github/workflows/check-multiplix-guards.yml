name: DB Guard — Multiplix RLS & Realtime PII

on:
  pull_request:
    paths:
      - 'supabase/migrations/**.sql'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  multiplix-guards:
    name: Multiplix RLS & Realtime PII guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run multiplix DB guard
        run: sh scripts/check-multiplix-guards.sh supabase/migrations
