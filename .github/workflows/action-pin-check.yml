name: action-pin-check

# Detecta ações de terceiros em workflows com tag mutável (@vN) sem SHA digest.
# Etapa 26 (2026-09-27): todos os terceiros foram pinados — enforcement agora é FULL-STATE
# (varre TODO o conteúdo dos arquivos, não só diff). Previne qualquer nova violação.
# actions/* e github/* são isentos (monitorados pelo Dependabot).
# Ações de terceiros com tags mutáveis representam risco de supply-chain.

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-action-pins:
    name: Detectar ações sem SHA pin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verificar ações de terceiros sem SHA digest (full-state)
        shell: bash
        run: |
          set -euo pipefail

          # FULL-STATE: varre TODOS os arquivos de workflow, não apenas diff.
          # Etapa 26 zerou o legado — agora qualquer terceiro sem SHA bloqueia.
          # actions/* e github/* são isentos (Dependabot os monitora).
          Q="'"
          UNPINNED=$(grep -rE \
            '[[:space:]]uses:[[:space:]]+[^/]+/[^@]+@[^[:space:]#]+' \
            .github/workflows/ .github/actions/ 2>/dev/null \
            | grep -v '.github/workflows/action-pin-check.yml' \
            | grep -Ev '[[:space:]]uses:[[:space:]]+(actions|github)/' \
            | grep -vE "[[:space:]]uses:[[:space:]]+[^/]+/[^@]+@[0-9A-Fa-f]{40}([[:space:]]|${Q}|\"|#|$)" \
            || true)

          TOTAL=$(grep -rEh \
            '[[:space:]]uses:[[:space:]]+[^/]+/[^@]+@[^[:space:]#]+' \
            .github/workflows/ .github/actions/ 2>/dev/null \
            | grep -Ev '[[:space:]]uses:[[:space:]]+(actions|github)/' \
            | wc -l | tr -d ' ')

          if [ -z "$UNPINNED" ]; then
            echo "✓ Todas as ${TOTAL} ações de terceiros estão pinadas por SHA digest."
            exit 0
          fi

          echo "::error::Ações de terceiros com tag mutável detectadas (sem SHA digest):"
          echo "$UNPINNED"
          echo ""
          echo "Substitua @<tag> por @<sha-de-40-hex> # tag: <versao>"
          echo "Exemplo: uses: 3rd-party/action@abc123def456...0000 # v2.3.1"
          exit 1
