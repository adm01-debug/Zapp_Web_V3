name: action-pin-check

# Detecta ações de terceiros adicionadas em workflows com tag mutável (@vN) sem SHA digest.
# Aplica enforcement incremental: verifica apenas linhas ADICIONADAS nos commits do evento,
# não falha em violações pré-existentes. actions/* e github/* são permitidos
# (monitorados pelo Dependabot). Ações de terceiros com tags mutáveis representam
# risco de supply-chain e são bloqueadas.

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-action-pins:
    name: Detectar ações sem SHA pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar ações de terceiros sem SHA digest
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FROM_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # Trata push de branch nova (before = zeros) ou SHA vazio
          if [ -z "$FROM_SHA" ] || echo "$FROM_SHA" | grep -qE '^0+$'; then
            echo "Branch nova ou SHA base ausente — analisando somente HEAD^..HEAD."
            FROM_SHA="HEAD^"
          fi

          # Obtém apenas linhas ADICIONADAS em todos os commits do evento
          # (enforcement incremental — não falha em violações pré-existentes)
          ADDED=$(git diff --unified=0 "$FROM_SHA" HEAD \
            -- '.github/workflows' '.github/actions' 2>/dev/null \
            | grep '^+' \
            | grep -v '^+++' \
            | grep -v '^\+[[:space:]]*#' \
            || true)

          if [ -z "$ADDED" ]; then
            echo "Nenhuma linha adicionada em workflows. OK."
            exit 0
          fi

          # Detecta linhas de uses: com refs que NÃO são SHA de 40 hex
          # Âncora no prefixo '+' do diff para evitar falsos positivos em run: ou comentários
          # Exclui: actions/* e github/* (monitorados pelo Dependabot)
          # Exclui: ações pinadas por SHA de 40 hex (case-insensitive para A-F)
          UNPINNED=$(printf '%s\n' "$ADDED" \
            | grep -E '^\+[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]+[^/]+/[^@]+@[^[:space:]#]+' \
            | grep -Ev '^\+[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]+(actions|github)/' \
            | grep -vE '^\+[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]+[^/]+/[^@]+@[0-9A-Fa-f]{40}([[:space:]]|#|$)' \
            || true)

          if [ -z "$UNPINNED" ]; then
            echo "Todas as ações de terceiros adicionadas estão pinadas por SHA digest. OK."
            exit 0
          fi

          echo "::error::Ações de terceiros com tag mutável detectadas nas linhas adicionadas (sem SHA digest):"
          echo "$UNPINNED"
          echo ""
          echo "Substitua @<tag> por @<sha-de-40-hex> # tag: <versao>"
          echo "Exemplo: uses: 3rd-party/action@abc123def456...0000 # v2.3.1"
          exit 1
