# ==========================================================================
# DB INVARIANTS — E20
# Validates that critical database contracts are not violated by any PR.
# ==========================================================================
# Invariants checked:
#   INV-1: All app Realtime subscriptions use the correct physical schema
#   INV-2: No Supabase subscription targets a leaf partition
#   INV-3: No hardcoded DEFAULT_WHATSAPP_INSTANCE in subscription filters
#   INV-4: Every useEffect that calls supabase.channel() must call unsubscribe()
#   INV-5: No bare .from('evolution_messages') without schema qualification
#   INV-6: supabase_realtime publication has not regressed (source: pg_catalog)
# ==========================================================================

name: DB Invariants

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "supabase/**"
  pull_request:
    branches: [main, develop]

concurrency:
  # PR: grupo unico por numero de PR, sem cancelar. Push/schedule: por ref, cancela.
  group: db-invariants-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.pull_request.number == '' }}

jobs:
  invariants:
    name: DB Invariants
    runs-on: [Linux, X64, vps-zapp]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: "INV-1: No schema:'public' in Realtime subscriptions"
        run: |
          echo "Checking for schema:'public' in .channel().on() calls..."
          # Whitelist exceptions — files where schema:'public' is intentional because
          # the physical table lives in public and is added to supabase_realtime:
          #   useAudioMessagePlayer.ts — public.audio-messages bucket (physical)
          #   useRetryMetrics.ts       — public.evolution_retry_metrics (physical table,
          #                              added by migration 20260802000003; zapp.evolution_retry_metrics
          #                              is a VIEW that never emits CDC events)
          FOUND=$(grep -rn "schema: ['\"']public['\"']" src/ \
            --include="*.ts" --include="*.tsx" \
            -l 2>/dev/null | \
            grep -v "src/features/inbox/components/useAudioMessagePlayer\.ts" | \
            grep -v "src/features/admin/hooks/monitoring/useRetryMetrics\.ts" \
            || true)

          if [ -n "$FOUND" ]; then
            echo "::error::INV-1 VIOLATION — schema:'public' detected in subscription(s)."
            grep -rn "schema: ['\"']public['\"']" src/ \
              --include="*.ts" --include="*.tsx" \
              --exclude="useAudioMessagePlayer.ts" \
              --exclude="useRetryMetrics.ts" 2>/dev/null || true
            exit 1
          fi
          echo "INV-1 passed."

      - name: "INV-2: No partition-leaf table names in Realtime subscriptions"
        run: |
          LEAF_PATTERN="(evolution_messages|evolution_conversations|evolution_webhook_events_v2)_(wpp2|artes|comercial_[0-9]+|compras|default|financeiro|gravacao|logistica|marketing|archive|wpp2_archive)"
          echo "Checking for partition leaf table subscriptions..."
          FOUND=$(grep -rEn "table: ['\"']${LEAF_PATTERN}['\"']" src/ \
            --include="*.ts" --include="*.tsx" 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "::error::INV-2 VIOLATION — Realtime subscription on partition leaf detected."
            echo "$FOUND"
            exit 1
          fi
          echo "INV-2 passed."

      - name: "INV-3: No hardcoded 'wpp2' in Realtime subscription filters"
        run: |
          echo "Checking for hardcoded 'wpp2' in filter strings..."
          FOUND=$(grep -rn "=eq\.wpp2\b" src/ \
            --include="*.ts" --include="*.tsx" 2>/dev/null | \
            grep -v "DEFAULT_WHATSAPP_INSTANCE\|// \|^[[:space:]]*//" || true)

          if [ -n "$FOUND" ]; then
            echo "::error::INV-3 VIOLATION — hardcoded 'wpp2' instance filter in Realtime subscription."
            echo "$FOUND"
            echo ""
            echo "Fix: Use a variable for the instance name:"
            echo '     filter: `instance_name=eq.${instanceName}`'
            echo "     where instanceName comes from props, params, or DEFAULT_WHATSAPP_INSTANCE."
            exit 1
          fi
          echo "INV-3 passed."

      - name: "INV-4: channel() calls must have matching unsubscribe() cleanup"
        run: |
          echo "Checking for .channel() without .unsubscribe() / removeChannel()..."
          VIOLATIONS=""

          CHANNEL_FILES=$(
            {
              grep -rl "supabase\.channel(" src/ \
                --include="*.ts" --include="*.tsx" 2>/dev/null || true
              grep -rl "supabase" src/ \
                --include="*.ts" --include="*.tsx" 2>/dev/null | \
                xargs -r grep -l "^[[:space:]]*\.channel(" 2>/dev/null || true
            } | sort -u | xargs -r grep -l "useEffect" 2>/dev/null || true
          )

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            HAS_SUBSCRIBE=$(grep -c "\.subscribe(" "$file" 2>/dev/null || true); HAS_SUBSCRIBE=${HAS_SUBSCRIBE:-0}
            HAS_CLEANUP=$(grep -cE "\.unsubscribe\(\)|removeChannel" "$file" 2>/dev/null || true); HAS_CLEANUP=${HAS_CLEANUP:-0}
            if [ "$HAS_SUBSCRIBE" -gt 0 ] && [ "$HAS_CLEANUP" -eq 0 ]; then
              VIOLATIONS="${VIOLATIONS}\n  $file (subscribe: $HAS_SUBSCRIBE, cleanup: 0)"
            fi
          done <<< "$CHANNEL_FILES"

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::INV-4 VIOLATION — .channel() without .unsubscribe() / removeChannel() cleanup."
            echo -e "Files with missing cleanup:$VIOLATIONS"
            exit 1
          fi
          echo "INV-4 passed."

      - name: "INV-5: evolution_messages/conversations subscriptions must use schema:'evo'"
        run: |
          echo "Checking evolution_* table subscriptions for correct schema..."
          FILES=$(grep -rl "table: ['\"']evolution_\(messages\|conversations\)['\"']" src/ \
            --include="*.ts" --include="*.tsx" 2>/dev/null || true)
          VIOLATIONS=""
          for file in $FILES; do
            HAS_EVO_SCHEMA=$(grep -c "schema: ['\"']evo['\"']" "$file" 2>/dev/null || echo "0")
            if [ "$HAS_EVO_SCHEMA" -eq 0 ]; then
              VIOLATIONS="${VIOLATIONS}\n  $file"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::INV-5 VIOLATION — evolution_messages/conversations subscribed without schema:'evo'."
            echo -e "Files with missing schema:$VIOLATIONS"
            exit 1
          fi
          echo "INV-5 passed."

      - name: "INV-6: publicacao supabase_realtime nao regrediu (fonte: pg_catalog)"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Unico invariante que consulta o banco. Os INV-1..5 sao estaticos, e
          # estatico nao resolve esta pergunta: `ALTER PUBLICATION` emitido por
          # EXECUTE format(...) dentro de bloco DO e invisivel a grep. Foi assim
          # que o PR #712 concluiu que faltavam 25 tabelas que ja estavam la.
          #
          # Separacao deliberada entre falha de INFRA e falha de INVARIANTE:
          # sem rota, sem psql e sem conectividade -> avisa e passa (nao ha o
          # que afirmar). Com uma rota de pe -> o check e BLOQUEANTE. Um gate que
          # reprova por motivo ambiental treina o time a ignorar gate.
          #
          # ROTA: este Postgres nao e publicado fora da malha do Swarm (por
          # desenho). Medido no run 36334628364: `psql "$SUPABASE_DB_URL"` nao
          # conecta de fora e o passo terminava em warning + exit 0 em TODA
          # execucao — este invariante, o unico live do repo, nunca verificou
          # nada. A rota que funciona e `docker exec` no container, a mesma do
          # drift-check.
          #
          # Detalhe que so aparece nessa rota: o `\copy` do .sql le o arquivo do
          # lado do CLIENTE do psql. Com o psql rodando dentro do container, o
          # cliente e o container — por isso o manifesto vai para /scripts/sql/
          # e o psql roda com CWD em /, onde o caminho relativo do repo resolve.
          if command -v docker >/dev/null 2>&1; then
            CONTAINER="$(docker ps --format '{{.Names}}' 2>/dev/null | grep -m1 -E '^supabase_db' || true)"
            if [ -n "$CONTAINER" ]; then
              docker exec "$CONTAINER" mkdir -p /scripts/sql
              docker cp scripts/sql/realtime-publication.manifest "$CONTAINER":/scripts/sql/realtime-publication.manifest
              echo "Rota 1 (docker exec em $CONTAINER) — invariante BLOQUEANTE."
              docker exec -i -w / "$CONTAINER" psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 \
                -f - < scripts/sql/check-realtime-publication.sql
              exit $?
            fi
            echo "::warning title=INV-6 rota 1 indisponivel::container supabase_db nao encontrado; tentando psql direto."
          fi

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::notice title=INV-6 nao executou::secret SUPABASE_DB_URL ausente. Enquanto ele nao existir, drift na publicacao supabase_realtime passa despercebido no CI."
            exit 0
          fi

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client || true
          fi
          if ! command -v psql >/dev/null 2>&1; then
            echo "::warning title=INV-6 nao executou::psql indisponivel no runner. Invariante nao verificado."
            exit 0
          fi

          if ! psql "$SUPABASE_DB_URL" -Atc 'SELECT 1' >/dev/null 2>&1; then
            echo "::warning title=INV-6 nao executou::sem conectividade com o banco a partir do runner. Invariante nao verificado."
            exit 0
          fi

          echo "Conectividade OK — rodando o invariante em modo bloqueante."
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/sql/check-realtime-publication.sql

      - name: "INV-7: RLS ligada em 100% das tabelas dos schemas do app"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Mesmo desenho do INV-6 e mesmo motivo para ser LIVE: o defeito que
          # este invariante cobre (zapp.cookies_config, 27/09/2026) tinha o
          # CREATE POLICY num arquivo de migração e o ENABLE ROW LEVEL SECURITY
          # ausente — policy sem RLS é decorativa, e um grep não responde
          # "a tabela está protegida hoje?".
          #
          # ROTA: este Postgres NÃO é publicado fora da malha do Swarm (por
          # desenho). Medido no run 36334628364: `psql "$SUPABASE_DB_URL"` de
          # fora dá "sem conectividade" e o passo terminava em warning + exit 0
          # em TODA execução — invariante que nunca verificava nada. A rota que
          # funciona é a mesma do drift-check: `docker exec` no container.
          #
          # Separação entre falha de INFRA e falha de INVARIANTE: sem docker,
          # sem psql e sem conectividade -> avisa e passa (não há o que
          # afirmar). Com uma rota de pé -> BLOQUEANTE.
          if command -v docker >/dev/null 2>&1; then
            CONTAINER="$(docker ps --format '{{.Names}}' 2>/dev/null | grep -m1 -E '^supabase_db' || true)"
            if [ -n "$CONTAINER" ]; then
              echo "Rota 1 (docker exec em $CONTAINER) — invariante BLOQUEANTE."
              docker exec -i "$CONTAINER" psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 \
                < scripts/sql/check-rls-coverage.sql
              exit $?
            fi
            echo "::warning title=INV-7 rota 1 indisponivel::container supabase_db nao encontrado; tentando psql direto."
          fi

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::notice title=INV-7 nao executou::sem docker e sem secret SUPABASE_DB_URL. Cobertura de RLS nao verificada."
            exit 0
          fi

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client || true
          fi
          if ! command -v psql >/dev/null 2>&1; then
            echo "::warning title=INV-7 nao executou::psql indisponivel no runner. Invariante nao verificado."
            exit 0
          fi

          if ! psql "$SUPABASE_DB_URL" -Atc 'SELECT 1' >/dev/null 2>&1; then
            echo "::warning title=INV-7 nao executou::sem conectividade com o banco a partir do runner. Invariante nao verificado."
            exit 0
          fi

          echo "Rota 2 (psql direto) — invariante BLOQUEANTE."
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/sql/check-rls-coverage.sql

      - name: Summary
        if: success()
        run: |
          echo "======================================"
          echo "DB INVARIANTS PASSED (INV-6 pode ter sido pulado)"
          echo "======================================"
          echo "INV-1: No schema:'public' in subscriptions  v"
          echo "INV-2: No partition-leaf table subscriptions v"
          echo "INV-3: No hardcoded 'wpp2' in filters       v"
          echo "INV-4: channel() cleanup present             v"
          echo "INV-5: evolution_* uses schema:'evo'         v"
          echo "INV-6: publicacao supabase_realtime intacta   v (skip sem secret)"
