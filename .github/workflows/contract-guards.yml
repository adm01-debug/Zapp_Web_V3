name: Contract Guards

on:
  pull_request:
    paths:
      - "scripts/check-*.mjs"
      - "src/shared/criticalPayloadSchemas.ts"
      - "supabase/functions/_shared/contract-schemas*.ts"
      - "supabase/functions/_shared/schemas.ts"
      - "src/lib/invokeEdge.ts"
      - ".github/workflows/contract-guards.yml"
  # 2026-09-27: schedule suspenso — ratchet de error-shapes excede o teto — reabilitar apos rodar: node scripts/check-error-shapes.mjs --atualizar-teto
  # Para reabilitar: remover este comentario e restaurar o bloco schedule:
  workflow_dispatch: {}


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  guards:
    name: Paridade de contratos + ratchet invokeEdge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Etapa 80 — paridade de contratos e schemas
        run: node scripts/check-contract-parity.mjs
      - name: Etapa 90 — ratchet de shapes de erro ad-hoc em Edge Functions
        run: node scripts/check-error-shapes.mjs
      - name: Etapa 91 — ratchet invokeEdge
        run: node scripts/check-invoke-edge-ratchet.mjs
