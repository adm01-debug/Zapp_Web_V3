name: DB Guard

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/db-guard.yml"
      - "scripts/generate-schema-catalog.mjs"
      - "scripts/compare-schema-catalog.mjs"
      - "scripts/lib/__tests__/compare-schema-catalog.test.mjs"
      - "scripts/check-mcp-exec-acl.mjs"
      - "src/integrations/supabase/types.ts"
      - "supabase/schema-catalog.json"
      - "supabase/schema-catalog-external-objects.json"
      - "supabase/rls-catalog.json"
      - "scripts/audit-rls-coverage.mjs"
      - "supabase/migrations/**"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/db-guard.yml"
      - "scripts/generate-schema-catalog.mjs"
      - "scripts/compare-schema-catalog.mjs"
      - "scripts/lib/__tests__/compare-schema-catalog.test.mjs"
      - "scripts/check-mcp-exec-acl.mjs"
      - "src/integrations/supabase/types.ts"
      - "supabase/schema-catalog.json"
      - "supabase/schema-catalog-external-objects.json"
      - "supabase/rls-catalog.json"
      - "scripts/audit-rls-coverage.mjs"
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      regen:
        description: 'Regenerar schema-catalog.json do live DB (commita resultado)'
        type: boolean
        default: false

concurrency:
  group: db-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.pull_request.number == '' }}

permissions:
  contents: read
  issues: write

jobs:
  catalog-fresh:
    name: Catalog fresh + ACL RPC MCP
    runs-on: [Linux, X64, vps-zapp]
    permissions:
      contents: read
    env:
      SCHEMA_CATALOG_SCHEMAS: public,zapp,evo
      META_URL: ${{ secrets.ZAPP_META_URL }}
      META_TOKEN: ${{ secrets.ZAPP_META_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Testar comparação e escopo dos objetos externos
        run: node --test scripts/lib/__tests__/compare-schema-catalog.test.mjs

      # Este passo é o check de frescura CANÔNICO: compara o catálogo commitado com uma
      # geração a partir de src/integrations/supabase/types.ts. Por design, o catálogo é
      # gerado do types.ts versionado — "nunca via --from-meta" (ver o comentário de
      # stripRightOnlyExternalObjects em scripts/generate-schema-catalog.mjs).
      #
      # 2026-09-27 — ele está VERMELHO por um motivo real e diagnosticado, e deve continuar
      # vermelho até a causa ser tratada:
      #   (a) ORIGEM: o job catalog-regen gerava com `--from-meta` (a fonte que o design
      #       proíbe). Isso injetou no arquivo canônico objetos externos — medido:
      #       `schemas.public.Functions.has_role`, do financeiro que compartilha o schema
      #       `public` (declarado right-only em schema-catalog-external-objects.json). Todo
      #       regen assim re-contaminava o artefato e derrubava este gate.
      #   (b) FONTE DESATUALIZADA: o types.ts de hoje declara APENAS o schema `public`
      #       (linhas 15 e 9372), enquanto o catálogo commitado tem `public,zapp,evo`. Ou
      #       seja: o artefato não é reproduzível a partir da fonte declarada, e o catálogo
      #       não pode ser regerado sem perder zapp/evo.
      # Consertado aqui: (a) o regen passou a usar a fonte canônica + guarda que recusa
      # commitar catálogo sem os schemas pedidos. (b) depende de regenerar types.ts pelo
      # workflow `gen-types-zapp.yml` — que abre PR e faz auto-merge de um arquivo gerado que
      # muda os tipos do app inteiro, então é decisão dos donos, não deste PR.
      - name: Catálogo local está determinístico
        run: node scripts/generate-schema-catalog.mjs --schemas "$SCHEMA_CATALOG_SCHEMAS" --check

      - name: Contrato RLS canônico + deltas pendentes
        run: node scripts/audit-rls-coverage.mjs --check --require-canonical

      - name: Gerar catálogo vivo via postgres-meta
        if: ${{ env.META_URL != '' && env.META_TOKEN != '' }}
        run: node scripts/generate-schema-catalog.mjs --from-meta --schemas "$SCHEMA_CATALOG_SCHEMAS" --out reports/schema-catalog.live.json

      - name: Comparar contrato do catálogo commitado com o catálogo vivo
        if: ${{ env.META_URL != '' && env.META_TOKEN != '' && github.event.inputs.regen != 'true' }}
        run: |
          if [ ! -f reports/schema-catalog.live.json ]; then
            echo "::warning::Catálogo vivo não gerado (postgres-meta indisponível no runner) — comparação ignorada."
            exit 0
          fi
          node scripts/compare-schema-catalog.mjs \
            --left supabase/schema-catalog.json \
            --right reports/schema-catalog.live.json \
            --ignore-source \
            --external-objects-file supabase/schema-catalog-external-objects.json

      - name: Avisar quando a checagem viva não executar
        if: ${{ env.META_URL == '' || env.META_TOKEN == '' }}
        run: |
          echo "::notice title=Catalog fresh não executou leitura viva::ZAPP_META_URL/ZAPP_META_TOKEN ausentes. Só a consistência local do schema-catalog foi validada nesta run."

      - name: Assertion ACL RPC MCP
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::notice title=ACL RPC MCP nao verificada::secret SUPABASE_DB_URL ausente. A assertion foi pulada nesta run."
            exit 0
          fi

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client || true
          fi
          if ! command -v psql >/dev/null 2>&1; then
            echo "::warning title=ACL RPC MCP nao verificada::psql indisponivel no runner. Assertion nao verificada."
            exit 0
          fi

          if ! psql "$SUPABASE_DB_URL" -Atc 'SELECT 1' >/dev/null 2>&1; then
            echo "::warning title=ACL RPC MCP nao verificada::sem conectividade com o banco a partir do runner. Assertion nao verificada."
            exit 0
          fi

          echo "Conectividade OK — rodando a assertion ACL em modo bloqueante."
          node scripts/check-mcp-exec-acl.mjs

      - name: Publicar catálogo vivo
        if: always() && env.META_URL != '' && env.META_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: schema-catalog-live
          path: reports/schema-catalog.live.json
          if-no-files-found: ignore
          retention-days: 14

  catalog-regen:
    name: Regen schema-catalog.json (somente workflow_dispatch com regen=true)
    # 2026-09-27 — CORREÇÕES neste job:
    #   1. `always()`: sem isso o job dependia de catalog-fresh ter passado, e o único caso
    #      em que um regen é necessário é justamente quando a frescura FALHA. O conserto
    #      estava bloqueado pelo sintoma (evidência: um dispatch regen=true terminou em
    #      "0 commits", sem nunca tentar).
    #   2. FONTE: usava `--from-meta`, que o design proíbe para o catálogo canônico (ver o
    #      comentário de stripRightOnlyExternalObjects no gerador). O --from-meta traz
    #      objetos externos que compartilham o schema `public` (ex.: public.has_role, do
    #      financeiro) e re-contamina o artefato. Agora gera do types.ts versionado.
    #   3. GUARDA: recusa commitar um catálogo que perdeu algum schema pedido — o sintoma
    #      exato de gerar da fonte errada (ou de fonte desatualizada). Sem ela, um regen pode
    #      apagar centenas de milhares de linhas de contrato em silêncio.
    if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.regen == 'true'
    runs-on: [Linux, X64, vps-zapp]
    needs: catalog-fresh
    permissions:
      contents: write
    env:
      SCHEMA_CATALOG_SCHEMAS: public,zapp,evo
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerar e commitar schema-catalog.json
        run: |
          node scripts/generate-schema-catalog.mjs --schemas "$SCHEMA_CATALOG_SCHEMAS" --out supabase/schema-catalog.json

          node -e '
            const fs = require("fs");
            const want = (process.env.SCHEMA_CATALOG_SCHEMAS || "").split(",").map((s) => s.trim()).filter(Boolean);
            const got = Object.keys(JSON.parse(fs.readFileSync("supabase/schema-catalog.json", "utf8")).schemas || {});
            const missing = want.filter((s) => !got.includes(s));
            if (missing.length) {
              console.error("::error title=Regen abortado::catálogo gerado sem os schemas: " + missing.join(", ") + " (tem: " + got.join(", ") + "). A fonte canônica (src/integrations/supabase/types.ts) provavelmente está desatualizada — rode o workflow gen-types-zapp.yml antes. Nada foi commitado.");
              process.exit(1);
            }
            console.log("schemas presentes no catálogo gerado: " + got.join(", "));
          '

          git config user.email "ci-bot@atomicabr.com.br"
          git config user.name "CI Bot [catalog-regen]"
          git add supabase/schema-catalog.json
          if git diff --staged --quiet; then
            echo "schema-catalog.json já estava atualizado — nada a commitar."
          else
            git commit -m "fix(ci): regen schema-catalog.json do types.ts canônico [skip ci]"
            git push
            echo "schema-catalog.json regenerado e commitado."
          fi
