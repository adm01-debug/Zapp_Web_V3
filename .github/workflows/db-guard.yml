name: DB Guard

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/db-guard.yml"
      - "scripts/generate-schema-catalog.mjs"
      - "scripts/compare-schema-catalog.mjs"
      - "scripts/lib/__tests__/compare-schema-catalog.test.mjs"
      - "scripts/check-mcp-exec-acl.mjs"
      - "src/integrations/supabase/types.ts"
      - "supabase/schema-catalog.json"
      - "supabase/schema-catalog-external-objects.json"
      - "supabase/rls-catalog.json"
      - "scripts/audit-rls-coverage.mjs"
      - "supabase/migrations/**"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/db-guard.yml"
      - "scripts/generate-schema-catalog.mjs"
      - "scripts/compare-schema-catalog.mjs"
      - "scripts/lib/__tests__/compare-schema-catalog.test.mjs"
      - "scripts/check-mcp-exec-acl.mjs"
      - "src/integrations/supabase/types.ts"
      - "supabase/schema-catalog.json"
      - "supabase/schema-catalog-external-objects.json"
      - "supabase/rls-catalog.json"
      - "scripts/audit-rls-coverage.mjs"
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      regen:
        description: 'Regenerar schema-catalog.json do live DB (commita resultado)'
        type: boolean
        default: false

concurrency:
  group: db-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.pull_request.number == '' }}

jobs:
  catalog-fresh:
    name: Catalog fresh + ACL RPC MCP
    runs-on: [Linux, X64, vps-zapp]
    permissions:
      contents: read
    env:
      SCHEMA_CATALOG_SCHEMAS: public,zapp,evo
      META_URL: ${{ secrets.ZAPP_META_URL }}
      META_TOKEN: ${{ secrets.ZAPP_META_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Testar comparação e escopo dos objetos externos
        run: node --test scripts/lib/__tests__/compare-schema-catalog.test.mjs

      # 2026-09-27 — CORREÇÃO. Este passo rodava
      #   node scripts/generate-schema-catalog.mjs --schemas "..." --check
      # ou seja: gerava o catálogo a partir de `src/integrations/supabase/types.ts` (fonte
      # local, que declara APENAS o schema `public`) e comparava com o
      # `supabase/schema-catalog.json` commitado — que é gerado por `--from-meta` com os
      # schemas `public,zapp,evo` (ver o job catalog-regen, abaixo). Fontes diferentes do
      # artefato => divergência garantida em toda run. O efeito colateral era pior que o
      # ruído: como `catalog-regen` tem `needs: catalog-fresh`, um catálogo defasado
      # deixava a frescura vermelha, e a frescura vermelha IMPEDIA o próprio regen de
      # rodar — o conserto era bloqueado pelo sintoma.
      # Agora o passo verifica o que o nome promete (determinismo da geração local: mesma
      # entrada => mesma saída) e a frescura do catálogo continua sendo verificada contra
      # o banco vivo nos passos `--from-meta` + compare abaixo.
      - name: Catálogo local é determinístico (mesma entrada => mesma saída)
        run: |
          node scripts/generate-schema-catalog.mjs --schemas "$SCHEMA_CATALOG_SCHEMAS" --out "$RUNNER_TEMP/cat-a.json"
          node scripts/generate-schema-catalog.mjs --schemas "$SCHEMA_CATALOG_SCHEMAS" --out "$RUNNER_TEMP/cat-b.json"
          # sem --external-objects-file aqui de propósito: as duas pontas vêm do types.ts
          # local, então a assimetria "objeto externo só existe no catálogo vivo" não se
          # aplica (com a flag, o comparador falha por presença inesperada).
          node scripts/compare-schema-catalog.mjs \
            --left "$RUNNER_TEMP/cat-a.json" \
            --right "$RUNNER_TEMP/cat-b.json" \
            --ignore-source

      - name: Contrato RLS canônico + deltas pendentes
        run: node scripts/audit-rls-coverage.mjs --check --require-canonical

      - name: Gerar catálogo vivo via postgres-meta
        if: ${{ env.META_URL != '' && env.META_TOKEN != '' }}
        run: node scripts/generate-schema-catalog.mjs --from-meta --schemas "$SCHEMA_CATALOG_SCHEMAS" --out reports/schema-catalog.live.json

      - name: Comparar contrato do catálogo commitado com o catálogo vivo
        if: ${{ env.META_URL != '' && env.META_TOKEN != '' && github.event.inputs.regen != 'true' }}
        run: |
          if [ ! -f reports/schema-catalog.live.json ]; then
            echo "::warning::Catálogo vivo não gerado (postgres-meta indisponível no runner) — comparação ignorada."
            exit 0
          fi
          node scripts/compare-schema-catalog.mjs \
            --left supabase/schema-catalog.json \
            --right reports/schema-catalog.live.json \
            --ignore-source \
            --external-objects-file supabase/schema-catalog-external-objects.json

      - name: Avisar quando a checagem viva não executar
        if: ${{ env.META_URL == '' || env.META_TOKEN == '' }}
        run: |
          echo "::notice title=Catalog fresh não executou leitura viva::ZAPP_META_URL/ZAPP_META_TOKEN ausentes. A frescura do schema-catalog contra o banco vivo NÃO foi verificada nesta run (só o determinismo da geração local)."

      - name: Assertion ACL RPC MCP
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::notice title=ACL RPC MCP nao verificada::secret SUPABASE_DB_URL ausente. A assertion foi pulada nesta run."
            exit 0
          fi

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client || true
          fi
          if ! command -v psql >/dev/null 2>&1; then
            echo "::warning title=ACL RPC MCP nao verificada::psql indisponivel no runner. Assertion nao verificada."
            exit 0
          fi

          if ! psql "$SUPABASE_DB_URL" -Atc 'SELECT 1' >/dev/null 2>&1; then
            echo "::warning title=ACL RPC MCP nao verificada::sem conectividade com o banco a partir do runner. Assertion nao verificada."
            exit 0
          fi

          echo "Conectividade OK — rodando a assertion ACL em modo bloqueante."
          node scripts/check-mcp-exec-acl.mjs

      - name: Publicar catálogo vivo
        if: always() && env.META_URL != '' && env.META_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: schema-catalog-live
          path: reports/schema-catalog.live.json
          if-no-files-found: ignore
          retention-days: 14

  catalog-regen:
    name: Regen schema-catalog.json (somente workflow_dispatch com regen=true)
    # 2026-09-27 — CORREÇÃO: `always()`. Sem isso, este job dependia de catalog-fresh ter
    # passado — e o único caso em que o regen é necessário é justamente quando a frescura
    # FALHA (catálogo defasado em relação ao banco vivo). O conserto estava bloqueado pelo
    # sintoma que ele conserta.
    if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.regen == 'true'
    runs-on: [Linux, X64, vps-zapp]
    needs: catalog-fresh
    permissions:
      contents: write
    env:
      SCHEMA_CATALOG_SCHEMAS: public,zapp,evo
      META_URL: ${{ secrets.ZAPP_META_URL }}
      META_TOKEN: ${{ secrets.ZAPP_META_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerar e commitar schema-catalog.json
        run: |
          if [ -z "${META_URL:-}" ] || [ -z "${META_TOKEN:-}" ]; then
            echo "::error::ZAPP_META_URL ou ZAPP_META_TOKEN ausentes — regen impossível."
            exit 1
          fi
          node scripts/generate-schema-catalog.mjs --from-meta --schemas "$SCHEMA_CATALOG_SCHEMAS" --out supabase/schema-catalog.json
          git config user.email "ci-bot@atomicabr.com.br"
          git config user.name "CI Bot [catalog-regen]"
          git add supabase/schema-catalog.json
          if git diff --staged --quiet; then
            echo "schema-catalog.json já estava atualizado — nada a commitar."
          else
            git commit -m "fix(ci): regen schema-catalog.json do live DB [skip ci]"
            git push
            echo "schema-catalog.json regenerado e commitado."
          fi
