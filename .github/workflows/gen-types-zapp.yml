name: Regenerate Supabase types (zapp + evo)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch base (types são gerados do schema self-hosted)'
        required: false
        default: 'main'
      schemas:
        description: 'Schemas (default: public,zapp,evo)'
        required: false
        default: 'public,zapp,evo'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  regen-types:
    runs-on: [Linux, X64, vps-zapp]
    timeout-minutes: 10
    environment: types-generation
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate dispatch ref
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Workflow deve ser disparado de main (ref atual: ${{ github.ref_name }}). Use --ref main."
            exit 1
          fi

      - name: Validate and set base branch
        id: base
        env:
          INPUT_BRANCH: ${{ github.event.inputs.branch || 'main' }}
        run: |
          if ! printf '%s' "${INPUT_BRANCH}" | grep -qE '^[a-zA-Z0-9/_.-]+$'; then
            echo "::error::Branch name inválido: ${INPUT_BRANCH}"
            exit 1
          fi
          echo "branch=${INPUT_BRANCH}" >> $GITHUB_OUTPUT

      - name: Validate and set schemas
        id: schemas
        env:
          INPUT_SCHEMAS: ${{ github.event.inputs.schemas || 'public,zapp,evo' }}
        run: |
          if ! printf '%s' "${INPUT_SCHEMAS}" | grep -qE '^[a-zA-Z0-9_]+(,[a-zA-Z0-9_]+)*$'; then
            echo "::error::Schemas inválidos: ${INPUT_SCHEMAS}. Use identificadores separados por vírgula."
            exit 1
          fi
          echo "schemas=${INPUT_SCHEMAS}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate types.ts
        env:
          META_URL: ${{ secrets.SUPABASE_META_URL }}
          META_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCHEMAS: ${{ steps.schemas.outputs.schemas }}
        run: node scripts/gen-types-zapp.mjs

      - name: Check diff against base branch
        id: diff
        env:
          BASE_BRANCH: ${{ steps.base.outputs.branch }}
        run: |
          git fetch origin "${BASE_BRANCH}"
          if git show "origin/${BASE_BRANCH}:src/integrations/supabase/types.ts" > /tmp/base-types.ts 2>/dev/null; then
            if diff -q /tmp/base-types.ts src/integrations/supabase/types.ts > /dev/null 2>&1; then
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "types.ts sem mudancas — schema em sync com ${BASE_BRANCH}"
            else
              echo "changed=true" >> $GITHUB_OUTPUT
              diff --stat /tmp/base-types.ts src/integrations/supabase/types.ts || true
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "types.ts nao existe em ${BASE_BRANCH} — criando"
          fi

      - name: Create branch and commit
        if: steps.diff.outputs.changed == 'true'
        id: commit
        env:
          BASE_BRANCH: ${{ steps.base.outputs.branch }}
          SCHEMAS_VAL: ${{ steps.schemas.outputs.schemas }}
        run: |
          BRANCH="chore/regen-types-$(date +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp src/integrations/supabase/types.ts /tmp/generated-types.ts
          git checkout -- src/integrations/supabase/types.ts
          git checkout -b "$BRANCH" "origin/${BASE_BRANCH}"
          cp /tmp/generated-types.ts src/integrations/supabase/types.ts
          git add src/integrations/supabase/types.ts
          git commit -m "chore(types): regenerate zapp/evo types [gen-types-zapp workflow]

          Schemas: ${SCHEMAS_VAL}
          Triggered by: ${{ github.actor }}
          Workflow run: ${{ github.run_id }}"
          git push origin "$BRANCH"

      - name: Create PR and auto-merge
        # DECISÃO DE AUTO-MERGE (etapa 93, 2026-09-27): types.ts é exceção documentada
        # Ref: docs/decisions/ADR-CI-001-gen-types-auto-merge.md
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_ACTIONS }}
          BASE_BRANCH: ${{ steps.base.outputs.branch }}
          SCHEMAS_VAL: ${{ steps.schemas.outputs.schemas }}
        run: |
          BRANCH="${{ steps.commit.outputs.branch }}"
          PR_URL=$(gh pr create \
            --base "${BASE_BRANCH}" \
            --head "$BRANCH" \
            --title "chore(types): regenerate zapp/evo types [$(date +%Y-%m-%d)]" \
            --body "Geração automática de \`types.ts\` via workflow \`gen-types-zapp\`.

          **Schemas:** \`${SCHEMAS_VAL}\`
          **Triggered by:** \`${{ github.actor }}\`
          **Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          > Auto-merge via squash — exceção documentada ao fluxo 'merge é ato humano'
          > (HERMES.md). Arquivo gerado, sem lógica de negócio. Ver ADR-CI-001.")
          echo "PR created: $PR_URL"
          REQUIRED=$(gh api "repos/$GITHUB_REPOSITORY/branches/${BASE_BRANCH}/protection/required_status_checks" \
            --jq '.contexts | length' 2>/dev/null || echo "0")
          if [ "${REQUIRED}" = "0" ]; then
            echo "::warning::branch protection sem required checks — auto-merge desabilitado (ADR-CI-001)"
            echo "PR aberto para revisão manual: $PR_URL"
          else
            gh pr merge "$BRANCH" --squash --auto --delete-branch
            echo "Auto-merge requested (squash)"
          fi

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "types.ts ja esta atualizado — nada a commitar"
