name: Schedule Health Monitor

# Etapa 83 do plano de CI (2026-09-27):
# Detecta cron schedules suspensos por comentário nos YAMLs e mantém uma issue aberta
# listando-os. Anti-esquecimento institucional — evita o cenário de "varreduras diárias
# desligadas sem prazo/dono para religar" (achado B7 da auditoria: 7 schedules suspensos).

on:
  schedule:
    - cron: "0 7 * * 1"  # toda segunda, 07:00 UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  detect-suspended-schedules:
    name: Detectar crons suspensos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Detectar workflows com schedule suspenso
        id: detect
        run: |
          # shellcheck disable=SC2086,SC2129
          set -euo pipefail

          # Captura arquivos com linha "# ... schedule suspenso ..."
          SUSPENDED=$(grep -rl "schedule suspenso\|schedule: suspenso\|schedule comentado\|schedule desabilitado\|schedule off\|schedule pausado" \
            .github/workflows/ 2>/dev/null \
            | grep -v "schedule-health.yml" \
            | sort || true)

          COUNT=$(echo "$SUSPENDED" | grep -c . || true)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$SUSPENDED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ -z "$SUSPENDED" ]; then
            echo "✓ Nenhum schedule suspenso detectado."
          else
            echo "⚠️  $COUNT workflow(s) com schedule suspenso:"
            echo "$SUSPENDED"
          fi

      - name: Criar/atualizar issue com crons suspensos
        if: steps.detect.outputs.count != '0'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          SUSPENDED_FILES: ${{ steps.detect.outputs.files }}
          SUSPENDED_COUNT: ${{ steps.detect.outputs.count }}
        with:
          script: |
            const files = process.env.SUSPENDED_FILES.trim().split('\n').filter(Boolean);
            const count = files.length;
            const date = new Date().toISOString().slice(0, 10);

            const body = [
              `## ⏸️ Schedules de CI suspensos — ${date}`,
              '',
              `${count} workflow(s) têm schedule comentado/suspenso sem prazo para religar:`,
              '',
              ...files.map(f => `- \`${f}\``),
              '',
              '**Ação:** Para cada workflow, avaliar se o problema que causou a suspensão foi resolvido,',
              'reabilitar o schedule e remover o comentário "suspenso", ou documentar uma data de revisão.',
              '',
              `_Detectado automaticamente por \`schedule-health.yml\` em ${date}._`,
            ].join('\n');

            // Procura issue aberta existente com o marker
            const MARKER = '[schedule-health-monitor]';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci',
              per_page: 50,
            });

            const existing = issues.find(i => i.title.includes(MARKER));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                title: `${MARKER} Schedules de CI suspensos (${count} workflows)`,
              });
              console.log(`Issue #${existing.number} atualizada.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${MARKER} Schedules de CI suspensos (${count} workflows)`,
                body,
                labels: ['ci', 'chore'],
              });
              console.log(`Issue #${created.data.number} criada.`);
            }

      - name: Fechar issue se não há suspensos
        if: steps.detect.outputs.count == '0'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const MARKER = '[schedule-health-monitor]';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci',
              per_page: 50,
            });
            const existing = issues.find(i => i.title.includes(MARKER));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                body: existing.body + '\n\n✅ Fechado automaticamente — nenhum schedule suspenso detectado.',
              });
              console.log(`Issue #${existing.number} fechada — nenhum suspenso.`);
            } else {
              console.log('Nenhuma issue aberta de schedule-health. OK.');
            }

      - name: Resumo
        if: always()
        run: |
          # shellcheck disable=SC2086,SC2129
          echo "## Schedule Health Monitor" >> $GITHUB_STEP_SUMMARY
          echo "- Workflows com schedule suspenso: **${{ steps.detect.outputs.count }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Data: $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
