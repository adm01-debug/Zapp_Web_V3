name: Workflow Lint (actionlint)

# Gate que verifica erros de sintaxe e semântica em todos os workflows GitHub Actions.
# Usa actionlint — linter estático oficial para GitHub Actions.
# Bloqueia PRs com workflows inválidos antes de chegarem na main.
# Etapa 82: também verifica se toda referência workflow_run aponta para um name: real
# (achado A4/B2 da auditoria 2026-09-27 — trigger morto por nome errado).

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.actionlint.yaml'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.actionlint.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint — verificar workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Instalar actionlint
        run: |
          # Download direto do release — evita curl|bash de branch mutable (supply-chain fix)
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin/ actionlint
          actionlint --version

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Executar actionlint em todos os workflows
        run: actionlint -color -config-file .actionlint.yaml .github/workflows/*.yml

      - name: Verificar referências workflow_run (etapa 82)
        # Garante que todo `workflows:` em `workflow_run:` aponta para um name: real.
        # Previne triggers mortos silenciosos (achado A4/B2 — bundle-secret-guard, notify-ci-failure).
        run: node scripts/check-workflow-run-refs.mjs

      - name: Resumo
        if: always()
        run: |
          echo "### Resultado Workflow Lint" >> $GITHUB_STEP_SUMMARY
          echo "- Workflows verificados: $(ls .github/workflows/*.yml | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- actionlint: verificação de sintaxe e semântica" >> $GITHUB_STEP_SUMMARY
          echo "- workflow_run refs: verificação de nomes cruzados" >> $GITHUB_STEP_SUMMARY
