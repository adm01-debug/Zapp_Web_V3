name: 🛡️ OSSF Scorecard

# ============================================================
# Etapa 38 do PLANO_50_ETAPAS_CONTINUACAO_2026-09-28.
# OpenSSF Scorecard mede práticas de segurança do repo
# (branch protection, pinning de actions, secret scanning,
# token permissions, dependency updates) e publica o resultado
# na aba Security do GitHub via SARIF.
#
# Os achados A1 (branch protection), A3 (PAT) e A7 (push
# protection) do plano de 100 etapas são exatamente as classes
# de problema que o Scorecard detecta continuamente.
# ============================================================

on:
  schedule:
    # Semanal, segunda 06:00 UTC.
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".actionlint.yaml"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - ".github/dependabot.yaml"
  workflow_dispatch: {}

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF para a aba Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
