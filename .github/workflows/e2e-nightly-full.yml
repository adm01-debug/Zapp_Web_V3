name: E2E Nightly Full

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL alvo da VPS'
        required: false
        default: 'https://zapp.atomicabr.com.br'
      runner:
        description: 'Runner alvo'
        required: false
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - ubuntu-latest
  # 2026-09-27: schedule suspenso — E2E full da VPS falha por issue de ambiente — usar workflow_dispatch para rodar manualmente
  # Para reabilitar: remover este comentario e restaurar o bloco schedule:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e-nightly:
    name: E2E Nightly Full Suite
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    timeout-minutes: 90
    env:
      BASE_URL: ${{ inputs.base_url || 'https://zapp.atomicabr.com.br' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Playwright
        run: bunx playwright install --with-deps chromium
      - name: Run full E2E suite
        run: bunx playwright test --reporter=html
        env:
          BASE_URL: ${{ env.BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-report
          path: playwright-report/
          retention-days: 7
