name: 🚀 Build & Deploy — ZAPP web v3

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag override (default: production-<sha>)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  # 2026-08-06 20:40: group renomeado para deploy-vps-v3 — o group antigo (v2)
  # ficou TRAVADO (runs em pending SEM jobs: bug conhecido do GitHub em que
  # run cancelado segura o concurrency group; publishes sem concurrency
  # processavam normalmente). Grupo novo preserva a serialização entre
  # deploys sem herdar o lock corrompido.
  group: deploy-vps-v3
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR exige minúsculas (repo renomeado p/ Zapp-Web-V3 quebra github.repository)
  IMAGE_NAME: ${{ github.repository_owner }}/zapp-web-v3/zapp-web

jobs:
  build-and-push:
    name: Build & push image
    # Build isolado da VPS de produção. Nunca adicionar fallback automático
    # para vps-zapp: uma indisponibilidade do runner deve parar o deploy, não
    # disputar CPU/RAM/I/O com Supabase, Traefik, Evolution e o app.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 2026-08-06 20:30: environment removido — runs com `environment:`
    # ficavam em pending SEM jobs (resolução travada na conta); todos os
    # secrets usados (VITE_*, PORTAINER_*, SUPABASE_*, ALERT_*) existem no
    # nível do repo. Workflow sem environment processa (mesmo padrão do
    # publish-evolution-api-custom, que roda normalmente).
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.release_identity.outputs.digest }}
      image_digest: ${{ steps.release_identity.outputs.digest }}
      canonical_image: ${{ steps.release_identity.outputs.canonical_image }}
      release_sha12: ${{ steps.release_identity.outputs.release_sha12 }}
      release_sha: ${{ steps.release_identity.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 🛡️ Preflight Secrets Validation
        env:
          CI: "true"
          ENFORCE_DEPLOY_SECRETS: "1"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node scripts/check-deploy-secrets.mjs
          echo "✅ Todos os secrets críticos (Auth, DB, Service Role) estão presentes."

      - uses: docker/setup-buildx-action@v4
        with:
          # 2026-08-15: nome fixo — sem ele o setup-buildx cria um builder novo
          # a cada run e abandona o anterior (4 orfaos acumulados em 2 dias).
          name: atomica-zapp
          # 2026-08-06: pin do buildkit — tag movel buildx-stable-1 = v0.31.2 quebra
          # neste kernel (runc: can't mask dir /proc/acpi: invalid argument);
          # v0.20.2 validado OK em build minimo e no contexto real.
          driver-opts: image=moby/buildkit:v0.20.2

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚡ Preparar assets N-1 (manifesto estrito)
        run: |
          set -euo pipefail
          rm -rf ./previous-assets /tmp/prev-assets /tmp/prev-manifest
          mkdir -p ./previous-assets
          docker rm -f prev-zapp 2>/dev/null || true
          if docker pull ghcr.io/${{ env.IMAGE_NAME }}:production-latest 2>/dev/null; then
            docker create --name prev-zapp ghcr.io/${{ env.IMAGE_NAME }}:production-latest >/dev/null
            if ! docker cp prev-zapp:/usr/share/nginx/html/current-assets.txt /tmp/prev-manifest 2>/dev/null; then
              echo "Imagem legada sem manifesto: retenção ignorada para eliminar o acúmulo histórico"
              docker rm -f prev-zapp >/dev/null
              exit 0
            fi
            mkdir -p /tmp/prev-assets
            docker cp prev-zapp:/usr/share/nginx/html/assets/. /tmp/prev-assets/
            docker rm -f prev-zapp >/dev/null

            COUNT=$(wc -l < /tmp/prev-manifest | tr -d ' ')
            [ "$COUNT" -le 5000 ] || { echo "::error::ASSET_RETENTION_FILES=${COUNT} (limite 5000)"; exit 1; }
            while IFS= read -r asset; do
              case "$asset" in ""|/*|*".."*) echo "::error::Manifesto contém caminho inválido: $asset"; exit 1 ;; esac
              [ -f "/tmp/prev-assets/$asset" ] || { echo "::error::Asset ausente no build anterior: $asset"; exit 1; }
              mkdir -p "./previous-assets/$(dirname "$asset")"
              cp "/tmp/prev-assets/$asset" "./previous-assets/$asset"
            done < /tmp/prev-manifest
            SIZE_KB=$(du -sk ./previous-assets | awk '{print $1}')
            [ "$SIZE_KB" -le 153600 ] || { echo "::error::ASSET_RETENTION_SIZE=${SIZE_KB}KB (limite 150MB)"; exit 1; }
            echo "Assets retidos: ${COUNT} arquivos, ${SIZE_KB}KB, exclusivamente do build N-1"
          else
            echo "Sem imagem anterior (1o deploy ou production-latest indisponivel) — ok"
          fi

      - name: Compute image tag
        id: meta
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          if [ -z "$TAG" ]; then TAG="production-${GITHUB_SHA::12}"; fi
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::IMAGE_TAG_INVALID — use apenas caracteres válidos de tag OCI"
            exit 1
          fi
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: |
            previous_assets=./previous-assets
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_GIT_SHA=${{ github.sha }}
            VITE_SENTRY_ENVIRONMENT=production
            VITE_APP_ENV=production
            VITE_ENABLE_CLIENT_OBSERVABILITY=true
          cache-from: type=gha,scope=zapp-web-production
          cache-to: type=gha,mode=max,scope=zapp-web-production

      - name: Derive canonical release identity
        id: release_identity
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image }}
          BUILD_DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::RELEASE_SHA_INVALID — github.sha precisa ser um SHA completo de 40 hex"
            exit 1
          fi
          if ! printf '%s' "$BUILD_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::BUILD_DIGEST_MISSING — docker/build-push-action não retornou digest OCI válido"
            exit 1
          fi
          # tag@digest mantém a identidade imutável e preserva a tag local de
          # rollback na VPS mesmo após docker image prune.
          {
            echo "digest=${BUILD_DIGEST}"
            echo "canonical_image=${IMAGE_TAG}@${BUILD_DIGEST}"
            echo "release_sha12=${GITHUB_SHA::12}"
            echo "release_sha=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: 📋 Ler tags de rollback protegidas (infra/ghcr-protected-tags.txt)
        id: protect
        run: |
          if [ ! -f infra/ghcr-protected-tags.txt ]; then
            echo "AVISO: infra/ghcr-protected-tags.txt nao encontrado — usando fallback hardcoded"
            echo "regex=^production-(57b05d295af8|7af6ecd0d51b)$" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Normaliza: remove comentários e linhas vazias, trim, lowercase, remove CRLF
          NORMALIZED="$(
            while IFS= read -r raw_line; do
              case "$raw_line" in
                ''|'#'*) continue ;;
              esac
              line="${raw_line#"${raw_line%%[![:space:]]*}"}"
              line="${line%"${line##*[![:space:]]}"}"
              line="$(printf '%s' "$line" | tr 'A-F' 'a-f' | tr -d '\r')"
              [ -n "$line" ] && printf '%s\n' "$line"
            done < infra/ghcr-protected-tags.txt
          )"
          # Arquivo vazio → fallback (não é erro de digitação, só arquivo ainda não populado)
          if [ -z "$NORMALIZED" ]; then
            echo "AVISO: nenhuma SHA encontrada no arquivo — usando fallback hardcoded"
            echo "regex=^production-(57b05d295af8|7af6ecd0d51b)$" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Falha se qualquer linha não for exatamente 12 hex lowercase (ex: fbd04bec303d)
          INVALID="$(echo "$NORMALIZED" | grep -Ev '^[0-9a-f]{12}$' || true)"
          if [ -n "$INVALID" ]; then
            echo "ERRO: infra/ghcr-protected-tags.txt contém entradas inválidas:" >&2
            while IFS= read -r invalid_line; do
              printf '  %s\n' "$invalid_line" >&2
            done < <(printf '%s\n' "$INVALID")
            echo "Cada linha deve ser exatamente 12 dígitos hex lowercase (ex: fbd04bec303d)." >&2
            exit 1
          fi
          TAGS="${NORMALIZED//$'\n'/|}"
          TAGS="${TAGS%|}"
          echo "regex=^production-(${TAGS})$" >> "$GITHUB_OUTPUT"

      # ============================================================
      # ETAPA 34 — Faxina Portainer (2026-08-05): retenção GHCR
      # Cada deploy cria ~3 versões (1 index tagado production-<sha> +
      # manifest amd64 + attestation-manifest, ambos untagged, pois o
      # buildx gera provenance por padrão). min-versions-to-keep=30
      # = 10 deploys ÍNTEGROS (múltiplo de 3: o corte por recência cai
      # ENTRE builds, nunca no meio — um valor não-múltiplo deixaria um
      # index mantido + amd64 deletado → pull com 'manifest unknown').
      # 2026-08-20 (plano-100 etapa 71): comentários alinhados ao valor
      # efetivo (30) — antes o código dizia 30 e a documentação dizia 9.
      # ⚠️ NÃO usar delete-only-untagged-versions aqui: apagaria os
      # manifests-filho (imagem/attestation) e o pull da tag falharia
      # com 'manifest unknown' (P0 confirmado via OCI index).
      # package-name = caminho completo SEM o owner (zapp-web-v3/zapp-web).
      # continue-on-error: retenção nunca pode BLOQUEAR o deploy; falha
      # é sinalizada pelo step de alerta abaixo (sentinel greppável).
      # ============================================================
      - name: 🧹 GHCR retention (keep 30 versions — 10 deploys íntegros)
        id: retention
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: zapp-web-v3/zapp-web
          package-type: container
          # 3 versões/deploy (index + amd64 + attestation). 30 = 10 deploys completos:
          # o corte de recência cai ENTRE builds, nunca no meio (evita index
          # mantido com filho deletado → manifest unknown). Sempre múltiplo de 3.
          min-versions-to-keep: 30
          # Proteger rollbacks históricos — lidos de infra/ghcr-protected-tags.txt.
          # NÃO usar delete-only-untagged-versions (apagaria manifests-filho → pull falha).
          ignore-versions: ${{ steps.protect.outputs.regex }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚨 Alerta se a retenção GHCR falhar (não bloqueia deploy)
        if: always() && steps.retention.outcome == 'failure'
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          GH_TOKEN_ACTIONS: ${{ secrets.GH_TOKEN_ACTIONS }}
        run: |
          MSG="GHCR retention FALHOU em ${{ github.sha }} — run ${{ github.run_id }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -fsS -X POST "$ALERT_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"⚠️ ${MSG}\"}" || true
          elif [ -n "$GH_TOKEN_ACTIONS" ]; then
            curl -fsS -X POST "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -H "Authorization: Bearer $GH_TOKEN_ACTIONS" \
              -H 'Accept: application/vnd.github+json' \
              -d "{\"body\":\"⚠️ ${MSG}\"}" || true
          fi
          echo "::warning::GHCR_RETENTION_FAILED ${MSG}"

  deploy:
    name: Deploy to VPS
    # Mesmo motivo do build: hosted runner sem alocação; deploy via Portainer
    # a partir da própria VPS (2026-08-06).
    runs-on: [Linux, X64, vps-zapp]
    needs: build-and-push
    timeout-minutes: 30
    outputs:
      canonical_image: ${{ needs.build-and-push.outputs.canonical_image }}
      image_digest: ${{ needs.build-and-push.outputs.image_digest }}
      release_sha12: ${{ needs.build-and-push.outputs.release_sha12 }}
      release_sha: ${{ needs.build-and-push.outputs.release_sha }}
    # environment removido (mesmo motivo do job build — ver acima)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify required secrets
        run: |
          missing=""
          [ -z "${PORTAINER_API_TOKEN}" ] && missing="$missing PORTAINER_API_TOKEN"
          [ -z "${PORTAINER_URL}" ]        && missing="$missing PORTAINER_URL"
          if [ -n "$missing" ]; then
            echo "::error::Required secrets not configured:${missing}"
            exit 1
          fi
        env:
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}

      - name: 🔒 Gate pre-deploy — anon do bundle aceita pelo Kong
        # Extrai a anon do image recem-buildado e valida contra o Kong ANTES do PUT stack.
        # Fecha o incidente 2026-08-20 (anon de outro ambiente servida em prod) na origem:
        # se a anon nao for aceita (200) ou for service_role, o deploy falha e prod nao muda.
        env:
          ZAPP_IMAGE: ${{ needs.build-and-push.outputs.canonical_image }}
          KONG_URL: https://supabase.atomicabr.com.br
        run: |
          set -euo pipefail
          echo "Gate: extraindo bundle de ${ZAPP_IMAGE}"
          docker pull "${ZAPP_IMAGE}" >/dev/null
          docker rm -f gate-zapp 2>/dev/null || true
          docker create --name gate-zapp "${ZAPP_IMAGE}" >/dev/null
          rm -rf /tmp/gate-assets && mkdir -p /tmp/gate-assets
          docker cp gate-zapp:/usr/share/nginx/html/assets/. /tmp/gate-assets/ 2>/dev/null || true
          docker rm -f gate-zapp >/dev/null 2>&1 || true
          ANON=""
          for f in /tmp/gate-assets/index-*.js; do
            [ -f "$f" ] || continue
            while IFS= read -r J; do
              [ -n "$J" ] || continue
              ROLE=$(node -e "try{const p=Buffer.from(process.argv[1].split('.')[1].replace(/-/g,'+').replace(/_/g,'/'),'base64').toString();process.stdout.write(String((JSON.parse(p)||{}).role||''))}catch(e){}" "$J" 2>/dev/null || true)
              if [ "$ROLE" = "service_role" ] || [ "$ROLE" = "service" ]; then
                echo "::error::SERVICE_ROLE_IN_BUILT_BUNDLE — $f embute role=$ROLE (abortando antes do deploy)"; exit 1
              fi
              [ "$ROLE" = "anon" ] && ANON="$J"
            done < <(grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' "$f" | sort -u)
          done
          if [ -z "$ANON" ]; then echo "::error::ANON_NAO_ENCONTRADA no bundle buildado (fail-closed)"; exit 1; fi
          CODE=000
          for attempt in 1 2; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${KONG_URL}/auth/v1/settings" -H "apikey: $ANON" || echo 000)
            [ "$CODE" = "200" ] && break
            echo "tentativa ${attempt}: auth/v1/settings=${CODE}"
            sleep 3
          done
          if [ "$CODE" != "200" ]; then
            echo "::error::ANON_REJEITADA_PELO_KONG — auth/v1/settings=${CODE} (esperado 200). Bundle traz anon de outro ambiente/chave errada. Deploy abortado; prod inalterada."; exit 1
          fi
          echo "Gate OK — anon do bundle aceita pelo Kong (200). Prosseguindo ao deploy."

      - name: Capturar release anterior para rollback explícito
        id: previous_release
        run: |
          set -euo pipefail
          SVC="zapp-web-prod_web"
          PREVIOUS_IMAGE=$(docker service inspect "$SVC" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
          if ! printf '%s' "$PREVIOUS_IMAGE" | grep -Eq '@sha256:[0-9a-f]{64}$'; then
            echo "::error::PREVIOUS_IMAGE_INVALID — serviço atual sem identidade tag@digest segura para rollback: ${PREVIOUS_IMAGE:-<vazio>}"
            exit 1
          fi
          PREVIOUS_DIGEST=$(printf '%s\n' "$PREVIOUS_IMAGE" | sed -nE 's/.*@(sha256:[0-9a-f]{64}).*/\1/p')
          echo "previous_image=${PREVIOUS_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "previous_digest=${PREVIOUS_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Release anterior: ${PREVIOUS_IMAGE}"

      - name: Deploy via Portainer API
        id: deploy_portainer
        continue-on-error: true
        env:
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          ZAPP_IMAGE: ${{ needs.build-and-push.outputs.canonical_image }}
        run: |
          set -euo pipefail
          echo "deploy_attempted=0" >> "$GITHUB_OUTPUT"
          echo "Deploying: ${ZAPP_IMAGE}"

          # ============================================================
          # ============================================================
          # ETAPA 65 CONCLUÍDA (2026-08-24): deploy lê compose versionado
          # Fonte única de verdade: infra/docker-compose-zapp-web.yml
          # ETAPA 12 — VPS Disk Defense Plan (preservado: SHA-based tags)
          # ============================================================
          compose_path="$(mktemp /tmp/zapp-compose.XXXXXX.yml)"
          rendered_path="$(mktemp /tmp/zapp-compose-rendered.XXXXXX.yml)"
          placeholder="\${ZAPP_IMAGE}"
          cp infra/docker-compose-zapp-web.yml "$compose_path"

          PLACEHOLDER_COUNT_BEFORE=$(grep -oF "$placeholder" "$compose_path" | wc -l | tr -d ' ')
          [ "$PLACEHOLDER_COUNT_BEFORE" = "1" ] || {
            echo "::error::COMPOSE_PLACEHOLDER_COUNT_INVALID — esperado exatamente 1 placeholder ZAPP_IMAGE, encontrado ${PLACEHOLDER_COUNT_BEFORE}"
            exit 1
          }

          # Substitui a variável ${ZAPP_IMAGE} pela release canônica pinada por digest
          sed -i "s|$placeholder|${ZAPP_IMAGE}|g" "$compose_path"
          PLACEHOLDER_COUNT_AFTER=$(grep -oF "$placeholder" "$compose_path" | wc -l | tr -d ' ')
          [ "$PLACEHOLDER_COUNT_AFTER" = "0" ] || {
            echo "::error::COMPOSE_PLACEHOLDER_REMAINS — placeholder ZAPP_IMAGE continuou no compose renderizado"
            exit 1
          }
          IMAGE_COUNT_AFTER=$(grep -Fxc "    image: ${ZAPP_IMAGE}" "$compose_path" || true)
          [ "$IMAGE_COUNT_AFTER" = "1" ] || {
            echo "::error::COMPOSE_IMAGE_COUNT_INVALID — compose não contém exatamente 1 imagem canônica renderizada"
            exit 1
          }
          docker stack config -c "$compose_path" > "$rendered_path"
          grep -Fq "${ZAPP_IMAGE}" "$rendered_path" || {
            echo "::error::COMPOSE_RENDERED_IMAGE_MISSING — docker stack config não preservou a imagem canônica"
            exit 1
          }
          echo "✅ Compose versionado usado: infra/docker-compose-zapp-web.yml"
          echo "Image no compose: $(grep 'image:' "$compose_path" | head -1 | xargs)"

          STACK_CONTENT=$(jq -Rs . < "$compose_path")
          PAYLOAD="{\"pullImage\":true,\"prune\":false,\"stackFileContent\":${STACK_CONTENT}}"

          echo "deploy_attempted=1" >> "$GITHUB_OUTPUT"
          HTTP=$(curl -s -o /tmp/pr.json -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 60 \
            -X PUT "${PORTAINER_URL}/api/stacks/157?endpointId=1" \
            -H "X-API-Key: ${PORTAINER_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}")

          echo "Portainer HTTP: ${HTTP}"
          head -c 400 /tmp/pr.json || true
          [ "${HTTP}" = "200" ] || { echo "::error::Deploy failed HTTP ${HTTP}"; exit 1; }

          # Aguardar além do start_period (30s) para checar o container novo, não o antigo
          echo "Aguardando 45s rollout (start_period=30s + margem)..."
          sleep 45

          # HC best-effort: start-first pode ter container antigo ainda em trânsito.
          # Falha aqui é ::warning:: (não exit 1) — Docker Swarm monitora saúde internamente.
          HC=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            https://zapp.atomicabr.com.br/auth || echo 000)
          echo "Health /auth: ${HC}"
          case "${HC}" in 200|301|302) echo "App OK" ;; *) echo "::warning::POST_DEPLOY_HC=${HC} — verificar serviço manualmente"; esac

      # ============================================================
      # Convergência verificada (plano-100 etapa 66, portada do draft
      # deploy-vps-selfhosted.yml em 2026-08-20): o PUT no Portainer
      # retorna 200 ANTES do rollout terminar. Sem esta verificação, um
      # deploy que não converge (rollback silencioso do Swarm, replica
      # 0/1, imagem antiga mantida) passava verde — e o post-deploy-health
      # não detecta, porque com order:start-first o container antigo
      # continua respondendo nas URLs públicas.
      # Em main o gate é fail-closed: sem escape hatch silencioso por repo var.
      # ============================================================
      - name: ✅ Convergência verificada (Swarm × imagem do deploy)
        id: convergence
        if: ${{ steps.deploy_portainer.outputs.deploy_attempted == '1' && steps.deploy_portainer.outcome == 'success' }}
        continue-on-error: true
        env:
          EXPECTED_IMAGE: ${{ needs.build-and-push.outputs.canonical_image }}
          EXPECTED_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
        run: |
          set -euo pipefail
          SVC="zapp-web-prod_web"
          DEADLINE=$((SECONDS + 300))
          IMG="?"; REPL="0/1"; TASKS=""
          extract_digest() {
            printf '%s\n' "$1" | sed -nE 's/.*@(sha256:[0-9a-f]{64}).*/\1/p'
          }
          while :; do
            STATUS=$(docker service inspect "$SVC" --format "{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}none{{end}}" 2>/dev/null || echo "inspect_fail")
            REPL=$(docker service ls --filter "name=${SVC}" --format "{{.Replicas}}" 2>/dev/null | head -1 || echo "0/1")
            IMG=$(docker service inspect "$SVC" --format "{{.Spec.TaskTemplate.ContainerSpec.Image}}" 2>/dev/null || echo "?")
            TASKS=$(docker service ps "$SVC" --filter desired-state=running --no-trunc --format "{{json .}}" 2>/dev/null || true)
            echo "estado=${STATUS} replicas=${REPL:-?} image=${IMG}"
            printf '%s\n' "${TASKS:-<sem tasks desejadas>}"
            case "$STATUS" in
              rollback_completed|rollback_paused|paused)
                echo "::error::CONVERGENCE_FAIL — UpdateStatus=${STATUS} (Swarm reverteu/pausou o rollout; a imagem nova NÃO está servindo)"; exit 1 ;;
            esac
            SPEC_DIGEST=$(extract_digest "$IMG")
            SPEC_IMAGE_FORMAT_OK=0
            SPEC_DIGEST_OK=0
            case "$SPEC_DIGEST" in
              sha256:*)
                SPEC_IMAGE_FORMAT_OK=1
                [ "$SPEC_DIGEST" = "$EXPECTED_DIGEST" ] && SPEC_DIGEST_OK=1
                ;;
            esac
            REPL_OK=$(echo "${REPL:-0/1}" | awk -F/ '{print ($1==$2 && $2!="0") ? "1" : "0"}')
            TASKS_PRESENT=0
            TASKS_JSON_OK=1
            TASKS_RUNNING_OK=1
            TASKS_ERROR_FREE=1
            TASKS_IMAGE_FORMAT_OK=1
            TASKS_DIGEST_OK=1
            while IFS= read -r task; do
              [ -n "$task" ] || continue
              TASKS_PRESENT=1
              if ! printf '%s\n' "$task" | jq -e . >/dev/null 2>&1; then
                TASKS_JSON_OK=0
                continue
              fi
              CURRENT_STATE=$(printf '%s\n' "$task" | jq -r '.CurrentState // empty')
              ERROR_FIELD=$(printf '%s\n' "$task" | jq -r '.Error // empty')
              TASK_IMAGE=$(printf '%s\n' "$task" | jq -r '.Image // empty')
              case "$CURRENT_STATE" in
                Running\ *) ;;
                *) TASKS_RUNNING_OK=0 ;;
              esac
              [ -z "$ERROR_FIELD" ] || TASKS_ERROR_FREE=0
              TASK_DIGEST=$(extract_digest "$TASK_IMAGE")
              case "$TASK_DIGEST" in
                sha256:*)
                  [ "$TASK_DIGEST" = "$EXPECTED_DIGEST" ] || TASKS_DIGEST_OK=0
                  ;;
                *)
                  TASKS_IMAGE_FORMAT_OK=0
                  ;;
              esac
            done < <(printf '%s\n' "$TASKS")
            if { [ "$STATUS" = "completed" ] || [ "$STATUS" = "none" ]; } \
              && [ "$SPEC_IMAGE_FORMAT_OK" = "1" ] \
              && [ "$SPEC_DIGEST_OK" = "1" ] \
              && [ "$REPL_OK" = "1" ] \
              && [ "$TASKS_PRESENT" = "1" ] \
              && [ "$TASKS_JSON_OK" = "1" ] \
              && [ "$TASKS_RUNNING_OK" = "1" ] \
              && [ "$TASKS_ERROR_FREE" = "1" ] \
              && [ "$TASKS_IMAGE_FORMAT_OK" = "1" ] \
              && [ "$TASKS_DIGEST_OK" = "1" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              [ "$SPEC_IMAGE_FORMAT_OK" = "1" ] || echo "::error::CONVERGENCE_SPEC_IMAGE_MALFORMED — spec do serviço sem digest OCI válido"
              [ "$SPEC_DIGEST_OK" = "1" ] || echo "::error::CONVERGENCE_SPEC_DIGEST_MISMATCH — spec do serviço diverge do digest esperado"
              [ "$TASKS_PRESENT" = "1" ] || echo "::error::CONVERGENCE_TASKS_MISSING — ${SVC} sem tasks desired-state=running"
              [ "$TASKS_JSON_OK" = "1" ] || echo "::error::CONVERGENCE_TASK_JSON_MALFORMED — task de desired-state=running retornou linha inválida"
              [ "$TASKS_RUNNING_OK" = "1" ] || echo "::error::CONVERGENCE_TASK_NOT_RUNNING — há task desired-state=running fora de estado Running"
              [ "$TASKS_ERROR_FREE" = "1" ] || echo "::error::CONVERGENCE_TASK_ERROR — há task desired-state=running com erro reportado"
              [ "$TASKS_IMAGE_FORMAT_OK" = "1" ] || echo "::error::CONVERGENCE_TASK_IMAGE_MALFORMED — task desired-state=running sem digest OCI válido"
              [ "$TASKS_DIGEST_OK" = "1" ] || echo "::error::CONVERGENCE_TASK_DIGEST_MISMATCH — task desired-state=running ainda não usa o digest esperado"
              echo "::error::CONVERGENCE_TIMEOUT — rollout não convergiu em 300s (estado=${STATUS} image=${IMG} replicas=${REPL})"; exit 1
            fi
            sleep 15
          done
          [ "$SPEC_IMAGE_FORMAT_OK" = "1" ] || { echo "::error::CONVERGENCE_SPEC_IMAGE_MALFORMED — spec do serviço sem digest OCI válido"; exit 1; }
          [ "$SPEC_DIGEST_OK" = "1" ] || { echo "::error::CONVERGENCE_SPEC_DIGEST_MISMATCH — spec do serviço diverge do digest esperado"; exit 1; }
          [ "$TASKS_PRESENT" = "1" ] || { echo "::error::CONVERGENCE_TASKS_MISSING — ${SVC} sem tasks desired-state=running"; exit 1; }
          [ "$TASKS_JSON_OK" = "1" ] || { echo "::error::CONVERGENCE_TASK_JSON_MALFORMED — task de desired-state=running retornou linha inválida"; exit 1; }
          [ "$TASKS_RUNNING_OK" = "1" ] || { echo "::error::CONVERGENCE_TASK_NOT_RUNNING — há task desired-state=running fora de estado Running"; exit 1; }
          [ "$TASKS_ERROR_FREE" = "1" ] || { echo "::error::CONVERGENCE_TASK_ERROR — há task desired-state=running com erro reportado"; exit 1; }
          [ "$TASKS_IMAGE_FORMAT_OK" = "1" ] || { echo "::error::CONVERGENCE_TASK_IMAGE_MALFORMED — task desired-state=running sem digest OCI válido"; exit 1; }
          [ "$TASKS_DIGEST_OK" = "1" ] || { echo "::error::CONVERGENCE_TASK_DIGEST_MISMATCH — task desired-state=running ainda não usa o digest esperado"; exit 1; }
          echo "✅ Convergência verificada: ${SVC} @ ${IMG} (digest ${EXPECTED_DIGEST}, replicas ${REPL})"

      - name: 🧾 Release identity canônica confirmada
        if: ${{ steps.deploy_portainer.outputs.deploy_attempted == '1' && steps.deploy_portainer.outcome == 'success' && steps.convergence.outcome == 'success' }}
        env:
          CANONICAL_IMAGE: ${{ needs.build-and-push.outputs.canonical_image }}
          EXPECTED_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
          RELEASE_SHA12: ${{ needs.build-and-push.outputs.release_sha12 }}
        run: |
          set -euo pipefail
          echo "release_sha12=${RELEASE_SHA12}"
          echo "digest=${EXPECTED_DIGEST}"
          echo "canonical_image=${CANONICAL_IMAGE}"
          {
            echo "### Release canônica confirmada"
            echo ""
            echo "- SHA12: \`${RELEASE_SHA12}\`"
            echo "- Digest: \`${EXPECTED_DIGEST}\`"
            echo "- Imagem: \`${CANONICAL_IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🌐 Release publicada corresponde ao commit
        id: public_release
        if: ${{ steps.deploy_portainer.outputs.deploy_attempted == '1' && steps.deploy_portainer.outcome == 'success' && steps.convergence.outcome == 'success' }}
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ needs.build-and-push.outputs.release_sha }}
          PUBLIC_ORIGIN: https://zapp.atomicabr.com.br
        run: |
          set -euo pipefail
          CACHE_BUSTER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VERSION_URL="${PUBLIC_ORIGIN}/version.json?release=${CACHE_BUSTER}"
          INDEX_URL="${PUBLIC_ORIGIN}/?release=${CACHE_BUSTER}"
          ACTUAL_SHA=""; ENTRY=""; PUBLIC_READY=0
          for attempt in 1 2 3 4 5 6; do
            VERSION=$(curl --fail --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' "$VERSION_URL") || { sleep 10; continue; }
            PARSED=$(printf '%s' "$VERSION" | jq -er '[.gitSha // "", .entry // ""] | @tsv') || {
              echo "tentativa ${attempt}: version.json inválido"
              sleep 10
              continue
            }
            IFS=$'\t' read -r ACTUAL_SHA ENTRY <<< "$PARSED"
            [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ] || {
              echo "tentativa ${attempt}: publicado ${ACTUAL_SHA:-<vazio>}"
              sleep 10
              continue
            }
            case "$ENTRY" in assets/*.js) ;; *) sleep 10; continue ;; esac
            INDEX=$(curl --fail --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' "$INDEX_URL") || { sleep 10; continue; }
            printf '%s' "$INDEX" | grep -Fq "/${ENTRY}" || { sleep 10; continue; }
            curl --fail --silent --show-error --max-time 20 \
              -o /dev/null "${PUBLIC_ORIGIN}/${ENTRY}" || { sleep 10; continue; }
            PUBLIC_READY=1
            break
          done
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::PUBLIC_RELEASE_SHA_MISMATCH — esperado ${EXPECTED_SHA}, publicado ${ACTUAL_SHA:-<vazio>}"
            exit 1
          fi
          case "$ENTRY" in
            assets/*.js) ;;
            *) echo "::error::PUBLIC_RELEASE_ENTRY_INVALID — ${ENTRY:-<vazio>}"; exit 1 ;;
          esac
          if [ "$PUBLIC_READY" != "1" ]; then
            echo "::error::PUBLIC_RELEASE_ENTRY_MISMATCH — index/asset não confirmaram ${ENTRY} após 6 tentativas"
            exit 1
          fi
          echo "✅ Release pública confirmada: ${ACTUAL_SHA} (${ENTRY})"

      - name: ↩️ Rollback automático explícito para a release anterior
        if: ${{ always() && steps.deploy_portainer.outputs.deploy_attempted == '1' && (steps.deploy_portainer.outcome == 'failure' || steps.convergence.outcome == 'failure' || steps.public_release.outcome == 'failure') }}
        env:
          PREVIOUS_IMAGE: ${{ steps.previous_release.outputs.previous_image }}
          PREVIOUS_DIGEST: ${{ steps.previous_release.outputs.previous_digest }}
        run: |
          set -euo pipefail
          SVC="zapp-web-prod_web"
          extract_digest() {
            printf '%s\n' "$1" | sed -nE 's/.*@(sha256:[0-9a-f]{64}).*/\1/p'
          }
          wait_for_digest() {
            local expected_digest="$1"
            local deadline=$((SECONDS + 300))
            local status img repl tasks spec_digest repl_ok tasks_present tasks_json_ok tasks_running_ok tasks_error_free tasks_image_format_ok tasks_digest_ok
            while :; do
              status=$(docker service inspect "$SVC" --format "{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}none{{end}}" 2>/dev/null || echo "inspect_fail")
              repl=$(docker service ls --filter "name=${SVC}" --format "{{.Replicas}}" 2>/dev/null | head -1 || echo "0/1")
              img=$(docker service inspect "$SVC" --format "{{.Spec.TaskTemplate.ContainerSpec.Image}}" 2>/dev/null || echo "?")
              tasks=$(docker service ps "$SVC" --filter desired-state=running --no-trunc --format "{{json .}}" 2>/dev/null || true)
              echo "rollback estado=${status} replicas=${repl} image=${img}"
              printf '%s\n' "${tasks:-<sem tasks desejadas>}"
              case "$status" in
                rollback_completed|rollback_paused|paused)
                  echo "::error::ROLLBACK_CONVERGENCE_FAIL — UpdateStatus=${status}"; exit 1 ;;
              esac
              spec_digest=$(extract_digest "$img")
              repl_ok=$(echo "${repl:-0/1}" | awk -F/ '{print ($1==$2 && $2!="0") ? "1" : "0"}')
              tasks_present=0
              tasks_json_ok=1
              tasks_running_ok=1
              tasks_error_free=1
              tasks_image_format_ok=1
              tasks_digest_ok=1
              while IFS= read -r task; do
                [ -n "$task" ] || continue
                tasks_present=1
                if ! printf '%s\n' "$task" | jq -e . >/dev/null 2>&1; then
                  tasks_json_ok=0
                  continue
                fi
                current_state=$(printf '%s\n' "$task" | jq -r '.CurrentState // empty')
                error_field=$(printf '%s\n' "$task" | jq -r '.Error // empty')
                task_image=$(printf '%s\n' "$task" | jq -r '.Image // empty')
                case "$current_state" in
                  Running\ *) ;;
                  *) tasks_running_ok=0 ;;
                esac
                [ -z "$error_field" ] || tasks_error_free=0
                task_digest=$(extract_digest "$task_image")
                case "$task_digest" in
                  sha256:*)
                    [ "$task_digest" = "$expected_digest" ] || tasks_digest_ok=0
                    ;;
                  *)
                    tasks_image_format_ok=0
                    ;;
                esac
              done < <(printf '%s\n' "$tasks")
              if { [ "$status" = "completed" ] || [ "$status" = "none" ]; } \
                && [ "$spec_digest" = "$expected_digest" ] \
                && [ "$repl_ok" = "1" ] \
                && [ "$tasks_present" = "1" ] \
                && [ "$tasks_json_ok" = "1" ] \
                && [ "$tasks_running_ok" = "1" ] \
                && [ "$tasks_error_free" = "1" ] \
                && [ "$tasks_image_format_ok" = "1" ] \
                && [ "$tasks_digest_ok" = "1" ]; then
                break
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::ROLLBACK_CONVERGENCE_TIMEOUT — rollback não convergiu ao digest anterior ${expected_digest}"
                exit 1
              fi
              sleep 15
            done
          }
          echo "Rollback explícito para ${PREVIOUS_IMAGE}"
          docker service update --image "${PREVIOUS_IMAGE}" "$SVC"
          wait_for_digest "$PREVIOUS_DIGEST"
          echo "✅ Rollback explícito concluído: ${PREVIOUS_IMAGE}"

      - name: ❌ Falhar workflow após rollback automático
        if: ${{ always() && steps.deploy_portainer.outputs.deploy_attempted == '1' && (steps.deploy_portainer.outcome == 'failure' || steps.convergence.outcome == 'failure' || steps.public_release.outcome == 'failure') }}
        run: |
          echo "::error::DEPLOY_REVERTIDO — rollout pós-tentativa falhou e a release anterior foi restaurada explicitamente"
          exit 1

      - name: 🧹 Prune dangling images pós-deploy (manutenção disco VPS)
        if: always()
        run: |
          # Remove imagens sem tag geradas pelo buildx/deploy (dangling).
          # Nunca remove imagens tagadas (ativas ou rollback) — apenas <none>.
          # Contexto: cada deploy pode deixar manifests órfãos de 50-120 MB.
          docker image prune -f
          echo "Imagens pos-prund:"
          docker system df 2>&1 | grep Images

  # ============================================================
  # Health check pós-deploy DETERMINÍSTICO (DP-09, 2026-08-06):
  # post-deploy-check.yml (workflow_run) não disparava de forma confiável;
  # este job roda somente após rollout confirmado, sem depender de webhooks.
  # Checagens: TTM, PostgREST, edge function e preflight CORS dos endpoints
  # que falharam juntos no incidente de 25/08/2026.
  # ============================================================
  post-deploy-health:
    name: 🩺 Health check pós-deploy (determinístico)
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: [Linux, X64, vps-zapp]
    timeout-minutes: 10
    steps:
      - name: "1/4 — TTM www.zappweb.app.br (< 3.0s)"
        run: |
          RESP=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 15 https://www.zappweb.app.br/ || true)
          CODE=$(echo "$RESP" | awk '{print $1}')
          TTM=$(echo "$RESP" | awk '{print $2}')
          CODE=${CODE:-000}
          TTM=${TTM:-0}
          echo "www.zappweb.app.br → HTTP ${CODE} em ${TTM}s"
          if [ "$CODE" = "000" ]; then
            echo "::error::SITE_DEAD — conexão falhou/timeout (HTTP 000)"
            exit 1
          fi
          if ! awk -v t="$TTM" 'BEGIN { exit !(t <= 3.0) }'; then
            echo "::error::TTM_TOO_SLOW — ${TTM}s > 3.0s (limite)"
            exit 1
          fi
          echo "✅ Site OK — TTM ${TTM}s (< 3.0s)"

      - name: "2/4 — Supabase PostgREST vivo (4xx ok; 5xx/timeout = falha)"
        if: always()
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://supabase.atomicabr.com.br/rest/v1/ || true)
          CODE=${CODE:-000}
          echo "supabase.atomicabr.com.br/rest/v1/ → HTTP ${CODE}"
          if [ "$CODE" = "000" ]; then
            echo "::error::SUPABASE_DEAD — timeout/conexão (HTTP 000)"
            exit 1
          fi
          case "$CODE" in
            5*) echo "::error::SUPABASE_DEAD — HTTP ${CODE} (5xx = servidor fora)"; exit 1 ;;
          esac
          echo "✅ PostgREST vivo — HTTP ${CODE} (401/4xx sem apikey é esperado)"

      - name: "3/4 — Edge Function get-media-base64 viva (4xx ok; 5xx/timeout = falha)"
        if: always()
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST https://supabase.atomicabr.com.br/functions/v1/evolution-api/get-media-base64 || true)
          CODE=${CODE:-000}
          echo "evolution-api/get-media-base64 (POST sem body) → HTTP ${CODE}"
          if [ "$CODE" = "000" ]; then
            echo "::error::EDGE_FUNCTION_DEAD — timeout/conexão (HTTP 000)"
            exit 1
          fi
          case "$CODE" in
            5*) echo "::error::EDGE_FUNCTION_DEAD — HTTP ${CODE} (5xx = função fora)"; exit 1 ;;
          esac
          echo "✅ Edge Function viva — HTTP ${CODE} (4xx sem body é esperado)"

      - name: "4/4 — Preflight CORS dos endpoints críticos"
        if: always()
        run: |
          set -euo pipefail
          ORIGIN="https://zapp.atomicabr.com.br"
          for URL in \
            "https://supabase.atomicabr.com.br/rest/v1/whatsapp_connections" \
            "https://supabase.atomicabr.com.br/functions/v1/evolution-api/status"; do
            HEADERS=$(curl -sS -D - -o /dev/null --max-time 15 -X OPTIONS "$URL" \
              -H "Origin: ${ORIGIN}" \
              -H "Access-Control-Request-Method: GET")
            CODE=$(printf '%s\n' "$HEADERS" | awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }')
            ALLOW=$(printf '%s\n' "$HEADERS" | awk -F': *' 'tolower($1)=="access-control-allow-origin" { gsub("\\r", "", $2); print $2 }' | tail -1)
            echo "$URL → HTTP ${CODE:-000}, ACAO=${ALLOW:-ausente}"
            case "${CODE:-000}" in 2*|4*) ;; *) echo "::error::CORS_PREFLIGHT_HTTP=${CODE:-000} em $URL"; exit 1 ;; esac
            case "$ALLOW" in "*"|"$ORIGIN") ;; *) echo "::error::CORS_HEADER_AUSENTE em $URL"; exit 1 ;; esac
          done
          echo "✅ CORS crítico disponível para o frontend"
