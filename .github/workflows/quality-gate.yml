name: Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  # PR: grupo unico por numero de PR, sem cancelar. Push/schedule: por ref, cancela.
  group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.pull_request.number == '' }}

jobs:
  quality-gate:
    # Todos os passos deste gate são herméticos: usam credenciais de teste e
    # não acessam a VPS nem o banco real. Executá-los no runner hospedado
    # evita a contenção do pool vps-zapp, que causou timeouts falsos no E2E
    # no mesmo SHA que passou a suíte completa em ubuntu-latest.
    runs-on: ubuntu-latest
    # Mantém folga para a suíte completa caso o runner hospedado esteja lento.
    timeout-minutes: 90
    env:
      CI: true
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
      VITE_EXTERNAL_SUPABASE_URL: https://example.supabase.co
      VITE_EXTERNAL_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        # Não roda hooks de lifecycle em CI; o gate precisa permanecer hermético.
        run: bun install --ignore-scripts

      - name: Lint (blocking — E02/F1-10)
        run: bun run lint

      - name: Integridade dos documentos de auditoria (blocking)
        run: bash scripts/check-audit-docs-integrity.sh

      - name: Refactor guards (ratchets — dead code + data layer)
        run: |
          set +e
          node scripts/check-dead-code.mjs
          status_dead=$?
          node scripts/check-data-layer.mjs
          status_data=$?
          if [ "$status_dead" -ne 0 ] || [ "$status_data" -ne 0 ]; then
            echo "::warning title=Refactor debt::Dead-code or data-layer ratchet flagged violations. Advisory — tracked as follow-up cleanup debt."
          fi
          exit 0

      - name: Migration linter — static drift guard (blocking on new violations)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before || 'HEAD~1' }}"
          fi
          changed=$(git diff --name-only "$base"...HEAD -- "supabase/migrations/*.sql" 2>/dev/null || true)
          if [ -z "$changed" ]; then
            echo "No migration files changed — linter skipped."
            exit 0
          fi
          echo "Linting changed migrations:"
          echo "$changed"
          CHANGED_FILES="$changed" node scripts/lint-migrations.mjs

      - name: RLS coverage audit (E34 — blocking)
        # 2026-08-31 (G9): catálogo RLS extraído do banco canônico + replay
        # ordenado somente das migrations posteriores ao watermark. Bloqueia
        # DROP POLICY, DISABLE RLS, bases desprotegidas e views críticas sem
        # security_invoker. Evidência 009.
        run: node scripts/audit-rls-coverage.mjs --check --require-canonical

      - name: Schema usage guardrail (zapp/evo)
        run: node scripts/check-schema-usage.mjs

      - name: Supabase cast safety (SUP-001..006 — blocking on errors)
        run: node scripts/lint-supabase-casts.mjs

      - name: Schema access simulation (~300 cenários — blocking)
        run: node scripts/simulate-schema-access.mjs

      # AUD-22D 2026-09-05: bloqueante. O baseline do ratchet (scripts/tsc-error-baseline.json)
      # está em 0 erros e o job "Gates TypeScript" do ci.yml já passa hospedado — a justificativa
      # antiga (GAR registry indisponível) não se sustenta mais.
      - name: Type Check (blocking)
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Cluster typecheck ratchet — blocking (crm-sales, queues, observability)
        run: |
          set +e
          node scripts/check-cluster-typecheck.mjs --cluster crm-sales
          status_sales=$?
          node scripts/check-cluster-typecheck.mjs --cluster queues
          status_queues=$?
          node scripts/check-cluster-typecheck.mjs --cluster observability
          status_obs=$?
          if [ "$status_sales" -ne 0 ] || [ "$status_queues" -ne 0 ] || [ "$status_obs" -ne 0 ]; then
            echo "::error title=Cluster typecheck::One or more cluster ratchets failed — check output above."
            exit 1
          fi

      - name: Cluster typecheck ratchet — advisory (inbox-core)
        run: node scripts/check-cluster-typecheck.mjs --cluster inbox-core
        continue-on-error: true

      - name: TypeScript Ratchet (blocking)
        run: node scripts/check-tsc-ratchet.mjs

      - name: Supabase types freshness (advisory — non-blocking)
        continue-on-error: true
        env:
          ZAPP_META_URL: ${{ secrets.ZAPP_META_URL }}
          ZAPP_META_TOKEN: ${{ secrets.ZAPP_META_TOKEN }}
        run: node scripts/check-types-freshness.mjs

      - name: Unit & Integration Tests (blocking)
        run: bun run test

      - name: Coverage ratchet (E45 — advisory until baseline calibrated)
        run: |
          bun run test:coverage -- --reporter=dot
          node scripts/check-coverage-ratchet.mjs
        continue-on-error: true

      - name: Fuzzing Tests (advisory — skip when no supabase local)
        run: |
          if ! curl -sf http://localhost:54321 > /dev/null 2>&1; then
            echo "::warning::Supabase local not available in CI — fuzzing skipped."
            exit 0
          fi
          bun run test:fuzz -- --runs 20 --baseUrl http://localhost:54321/functions/v1
        continue-on-error: true

      - name: Install Playwright Browsers
        # Este gate roda chromium + firefox. O WebKit continua coberto pelo
        # job E2E hospedado de ci.yml, sem duplicar custo neste workflow.
        run: bunx playwright install --with-deps chromium firefox

      - name: E2E Tests (boot suite — Chromium + Firefox hospedado)
        # A matriz cross-browser completa, incluindo WebKit, continua coberta
        # pelo job `E2E tests` de ci.yml em ubuntu-latest.
        run: bun run test:e2e:boot -- --project=chromium --project=firefox

      - name: Build (produces dist/ for the Performance Budget Gate)
        # O gate mede os chunks REAIS de dist/ — sem build ele falha com
        # "dist não encontrado" (E02-N02: antes passava sem medir nada).
        # NODE_OPTIONS: mesmo runner/comando estourou o heap default do Node
        # no job `build` do ci.yml (run 32443579939) e, com 6144, foi morto
        # por SIGKILL do OOM-killer do kernel por falta de RAM real do host
        # (run 32455497422, 2026-08-21) — 4096 fica entre os dois pontos
        # medidos (ver comentario espelho em ci.yml).
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build

      - name: Performance Budget Gate (blocking — E02/F10-06)
        run: bun run perf:budget
