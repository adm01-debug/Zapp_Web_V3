name: Cleanup E2E data (REST)

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_SERVICE_ROLE_KEY: { required: true }
  # 2026-09-27: schedule suspenso — RPC rpc_e2e_cleanup falha (evolution_contacts e VIEW) — corrigir RPC antes de reativar
  # Para reabilitar: remover este comentario e restaurar o bloco schedule:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  cleanup:
    name: Limpar dados E2E (rpc_e2e_cleanup)
    runs-on: [Linux, X64, vps-zapp]
    timeout-minutes: 10
    steps:
      # E2E-05/E2E-06 (2026-08-07): porta 22 da VPS fechada p/ internet — SSH
      # morto. Cleanup via zapp.rpc_e2e_cleanup() (SECURITY DEFINER — remove
      # contatos/conversas/mensagens zapp + evo pela convenção E2E, janela
      # 90d) + REST com service_role — sem SSH, sem psql remoto.
      - name: Executar cleanup via RPC
        env:
          SUPABASE_URL: https://supabase.atomicabr.com.br
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          HTTP=$(curl -s -o /tmp/cleanup.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/rpc_e2e_cleanup" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          cat /tmp/cleanup.json
          if [ "$HTTP" != "200" ]; then
            echo "::error::E2E_CLEANUP_FAIL — RPC retornou HTTP $HTTP ($(cat /tmp/cleanup.json))"
            exit 1
          fi
          echo "✅ Cleanup OK — $(cat /tmp/cleanup.json)"
