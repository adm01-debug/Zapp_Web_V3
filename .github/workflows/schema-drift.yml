name: schema-drift-guard

# Dois jobs:
# 1. static-drift (PR/push) — análise estática sem acesso ao banco.
# 2. live-drift (manual/webhook) — conecta ao banco via DATABASE_URL.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-drift:
    name: schema-drift-guard
    runs-on: [Linux, X64, vps-zapp]
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect DDL outside supabase/migrations/
        run: |
          set -euo pipefail
          base_ref="origin/${{ github.base_ref || 'main' }}"
          if ! git fetch origin "${{ github.base_ref || 'main' }}"; then
            echo "::warning::git fetch falhou — usando HEAD como base de comparação"
          fi

          if git rev-parse "$base_ref" >/dev/null 2>&1; then
            changed_sql=$(git diff --diff-filter=AM --name-only "$base_ref"...HEAD -- '*.sql' | \
              grep -v '^supabase/migrations/' | \
              grep -v '^infra/migrations/' | \
              grep -v '^scripts/' | \
              grep -v '^supabase/functions/' | \
              grep -v '^supabase/ci/' | \
              grep -v '^docs/runbooks/P100_EVO_FIXES_MANUAL\.sql$' || true)
          else
            changed_sql=""
          fi

          if [ -z "$changed_sql" ]; then
            echo "Sem arquivos .sql fora dos diretórios de migrations. OK."
            exit 0
          fi

          ddl_found=0
          for f in $changed_sql; do
            if grep -qiE '^\s*(CREATE|ALTER|DROP)\s+(TABLE|VIEW|FUNCTION|INDEX|SCHEMA|TYPE|SEQUENCE|TRIGGER|POLICY)' "$f" 2>/dev/null; then
              echo "::error file=$f::DDL fora de supabase/migrations/ ou infra/migrations/ detectado."
              ddl_found=1
            fi
          done

          if [ "$ddl_found" -eq 1 ]; then
            exit 1
          fi
          echo "Nenhum DDL fora dos diretórios rastreados. OK."

  live-drift:
    name: Live schema drift (requer DATABASE_URL)
    runs-on: [Linux, X64, vps-zapp]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Instalar psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Guard de drift (via função no banco)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL não definido — pulando (o guard roda in-cluster)."
            exit 0
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT ops.check_schema_drift(true);"

      - name: Instalar dependências (pg driver)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL não definido — pulando instalação do pg."
            exit 0
          fi
          npm install --prefix . --no-save pg@8

      - name: Verificar drift migration repo ↔ banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL não definido — pulando verificação de drift de migration."
            exit 0
          fi
          node scripts/check-migration-version-bank-drift.mjs
