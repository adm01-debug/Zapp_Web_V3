name: db-migrate

# Aplicador de migrations no Supabase self-hosted (causa-raiz do incidente
# 2026-08-18: 19 migrations commitadas via fluxo Lovable GitHub-first e nunca
# aplicadas -> drift repo x DB, 400/404 no front). Mesmo padrao do
# edge-deploy.yml: runner self-hosted da VPS com /var/run/docker.sock;
# aplica via docker exec supabase_db psql -U postgres (peer local, sem secret).
#
# Dispara em push na main que toque supabase/migrations/**, em PR que
# toque migrations (dry-run forçado — etapa 43 do plano de 100: aplicação
# fica exclusiva do push na main; PR só lista o plano + valida o arquivo)
# e em dispatch manual (dry_run default true).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  pull_request:
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'So listar migrations pendentes (nao aplica)'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  apply:
    name: Apply pending migrations (self-hosted DB)
    runs-on: [Linux, X64, vps-zapp]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Apply pending migrations
        id: migrate
        env:
          # PR = dry-run forçado (etapa 43): nunca aplica fora da main.
          DRY_RUN: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && '1' || '0' }}
        run: |
          bash infra/db-migrate/apply-migrations.sh 2>&1 | tee /tmp/migrate-out.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Step Summary
        if: always()
        run: |
          EXIT="${{ steps.migrate.outputs.exit_code }}"
          DRY="${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}"
          echo "## db-migrate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY" = "1" ]; then
            echo "🔍 **Modo dry-run** — nenhuma migration foi aplicada." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EXIT" = "0" ]; then
            echo "✅ **Migrations aplicadas com sucesso.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Falha ao aplicar migrations** — verifique o log abaixo." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Saída completa</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          tail -100 /tmp/migrate-out.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(sem saída)" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar plano no PR (dry-run)
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXIT: ${{ steps.migrate.outputs.exit_code }}
        run: |
          set -uo pipefail
          STATUS="✅ dry-run OK"
          [ "$EXIT" != "0" ] && STATUS="❌ dry-run falhou — corrigir antes do merge (a aplicação real roda no push da main)"
          {
            echo "### 🗄️ db-migrate — dry-run do PR"
            echo ""
            echo "**${STATUS}**"
            echo ""
            echo '```'
            tail -40 /tmp/migrate-out.txt 2>/dev/null || echo "(sem saída)"
            echo '```'
          } > /tmp/pr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/pr-comment.md || true
