name: AI Agent PR Policy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-ai-authors:
    # ubuntu-latest (auditoria 2026-08-21, PR #1368 piloto validado): só git log local, sem DB/VPS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for AI-generated direct pushes to protected branch
        run: |
          AI_AUTHORS=(
            "claude" "copilot" "lovable" "github-actions" "dependabot"
            "noreply@anthropic.com" "noreply@github.com"
          )

          # Check commits pushed directly to the protected branch.
          #
          # --first-parent e essencial: sem ele, `git log $BASE..$HEAD` inclui os
          # commits que vieram DENTRO de um merge de PR, e nao apenas os empurrados
          # direto na branch. Como todo o fluxo deste repo e PR aberta por agente,
          # cada merge fazia o gate acusar "direct push" — falso positivo em 100%
          # dos merges, exatamente o fluxo que a politica quer INCENTIVAR.
          #
          # Com --first-parent so a linha principal da branch e percorrida: um merge
          # de PR contribui apenas o proprio commit de merge (descartado por
          # --no-merges), enquanto um push direto aparece como commit linear e segue
          # sendo bloqueado.
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"

          # Guard against zero-SHA on initial push (new branch with no prior commit)
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push to branch — checking all commits up to $HEAD"
            COMMITS=$(git log --no-merges --first-parent --format='%an <%ae>' "$HEAD" 2>/dev/null || true)
          else
            echo "Checking direct push commits: $BASE..$HEAD"
            COMMITS=$(git log --no-merges --first-parent --format='%an <%ae>' "$BASE..$HEAD" 2>/dev/null || true)
          fi

          if [ -z "$COMMITS" ]; then
            echo "No commits to check."
            exit 0
          fi

          BLOCKED=false
          for author in "${AI_AUTHORS[@]}"; do
            if echo "$COMMITS" | grep -qi "$author"; then
              echo "::error::Blocked AI-authored direct push detected: '$author'"
              BLOCKED=true
            fi
          done

          if [ "$BLOCKED" = true ]; then
            echo ""
            echo "AI agents must open pull requests — direct pushes to protected branches are not allowed."
            echo "Committers found:"
            echo "$COMMITS"
            exit 1
          fi

          echo "✅ No AI-authored direct pushes detected."
