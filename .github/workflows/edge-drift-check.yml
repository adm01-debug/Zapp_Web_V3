name: edge-drift-check

on:
  pull_request:
    branches: [main]
  # 2026-09-27: schedule suspenso — orphan/stale edge functions detectados diariamente mas drift nao resolvido no repo
  # Para reabilitar: remover este comentario e restaurar o bloco schedule:
  # Etapa 48: reabilitar após etapa 5 (criar secret SUPABASE_ANON_KEY) estar concluída
  workflow_dispatch:

# Etapa 30: removido issues:write (nunca usado neste workflow — issue criação não existe aqui)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Etapas 28 + 43: jobs drift e e39 fundidos (ambos rodavam o mesmo deploy-edge.sh 2×)
  # Removida a instalação do Supabase CLI via curl|sh (não era usada por nenhum step).
  drift-and-hash:
    name: edge-drift-check (E38/E39)
    runs-on: [Linux, X64, vps-zapp]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Verificar vars de ambiente
        id: env_check
        run: |
          missing=""
          for var in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY; do
            [ -z "${!var}" ] && missing="$missing $var"
          done
          if [ -n "$missing" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::notice::E38/E39: vars ausentes em PR ($missing) — skip silencioso"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "::error::E38/E39: vars de ambiente obrigatórias ausentes:$missing"
            exit 1
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Registry de órfãos — teste de regressão
        # Sem `node --test`: este job roda em runner self-hosted cujo Node é
        # anterior ao 18 ("node: bad option: --test", run 36328997858). O teste é
        # um script autônomo com saída TAP — roda em qualquer Node com ESM.
        run: bash infra/edge-deploy/__tests__/edge-orphan-registry.test.sh

      - name: Verificar edge functions (MISSING/STALE/ORPHAN)
        if: steps.env_check.outputs.skip != 'true'
        run: bash infra/edge-deploy/deploy-edge.sh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
