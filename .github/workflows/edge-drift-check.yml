name: edge-drift-check

on:
  pull_request:
    branches: [main]
  # 2026-09-27: schedule suspenso — orphan/stale edge functions detectados diariamente mas drift nao resolvido no repo
  # Para reabilitar: remover este comentario e restaurar o bloco schedule:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drift:
    name: edge-drift-check
    runs-on: [Linux, X64, vps-zapp]
    steps:
      - uses: actions/checkout@v7

      - name: E38 — Completude de ambiente
        id: env_check
        run: |
          missing=""
          for var in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY; do
            [ -z "${!var}" ] && missing="$missing $var"
          done
          if [ -n "$missing" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::notice::E38: vars ausentes em PR ($missing) — skip silencioso"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "::error::E38: vars de ambiente obrigatórias ausentes:$missing"
            exit 1
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: E38 — Instalar Supabase CLI
        if: steps.env_check.outputs.skip != 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/supabase/cli/main/install.sh | sh
          supabase --version

      - name: E38 — Verificar edge functions (MISSING/STALE/ORPHAN)
        if: steps.env_check.outputs.skip != 'true'
        run: bash scripts/deploy-edge.sh --read-only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  e39:
    name: E39 — hash drift (volume × repo)
    runs-on: [Linux, X64, vps-zapp]
    steps:
      - uses: actions/checkout@v7

      - name: E39 — deploy-edge.sh read-only (falha em MISSING/STALE/ORPHAN)
        run: bash scripts/deploy-edge.sh --read-only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
