name: score-ratchet — advisory (E98)

on:
  pull_request:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  ratchet:
    name: Ratchet do placar de desacoplamento (advisory)
    # ubuntu-latest (auditoria 2026-08-21, PR #1368 piloto validado): compara arquivos locais + github-script, sem DB/VPS.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Comparar score do PR vs baseline T1
        id: ratchet
        run: |
          # shellcheck disable=SC2086
          set -uo pipefail
          BASELINE="docs/decouple/BOUNDARY_SCORE_T1.json"
          PR_SCORE="decouple-score.json"
          if [ ! -f "$PR_SCORE" ] || [ ! -f "$BASELINE" ]; then
            echo "Sem decouple-score.json ou sem baseline T1 — advisory skip."
            echo "has_score=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_score=true" >> $GITHUB_OUTPUT

          node - <<'EOF'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('docs/decouple/BOUNDARY_SCORE_T1.json','utf8')).invariants || [];
          let pr = {};
          try { pr = JSON.parse(fs.readFileSync('decouple-score.json','utf8')); } catch(e) { console.log('score do PR ilegível — advisory'); process.exit(0); }
          const prInv = pr.invariants || pr.raw_db_measurement || pr;
          // placar por invariante: score 1 = pass
          const keys = ['I1','I2','I3','I4','I5','I6','I7','I8','I9'];
          let piorou = [];
          for (const k of keys) {
            const b = base.find(i => i.invariant === k);
            if (!b) continue;
            const pv = prInv[k] !== undefined ? Number(prInv[k]) : (pr.summary?.passed !== undefined ? null : null);
            if (pv === null) continue;
            // baseline score 1 = ok; pv 0 = violação
            if (b.score === 1 && pv === 0) piorou.push(k);
          }
          if (piorou.length) {
            console.log(`⚠️ ADVISORY: invariantes que pioraram vs T1: ${piorou.join(', ')} — verifique antes do merge.`);
          } else {
            console.log('Ratchet OK: nenhum invariante piorou vs T1 (advisory).');
          }
          EOF

      - name: Comentar no PR (advisory)
        # Etapa 41: só posta quando há score real para comparar (evita spam em PRs sem decouple-score.json)
        if: steps.ratchet.outputs.has_score == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const MARKER = '<!-- score-ratchet-advisory -->';
            const msg = `${MARKER}\n### 🎯 Ratchet de desacoplamento (E98 — advisory)\nPlacar comparado com \`BOUNDARY_SCORE_T1.json\` (baseline 16/08). Modo advisory: **não bloqueia** o PR.`;

            // Deduplicação: atualiza comentário existente em vez de criar um novo
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: msg,
              }).catch(() => {});
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: msg,
              }).catch(() => {});
            }
