# migration-drift-guard.yml
# Detecta drift entre arquivos de migration do repo e a tabela
# supabase_migrations.schema_migrations no banco de produção.
#
# Casos detectados:
#   DB_ONLY        — migration aplicada no banco sem arquivo no repo (shadow migration)
#   REPO_ONLY      — arquivo no repo sem entrada no banco (migration não aplicada)
#   PREFIX_COLLISION — dois arquivos com mesmo timestamp (silently ignored)
#   NAME_MISMATCH  — mesmo version, nomes diferentes (renaming drift)
#
# Modo atual: WARN-ONLY (exit 0) — posta comentário no PR mas não bloqueia merge.
# Para enforcer estrito: alterar exit code da step "Run drift check" de 0 para $DRIFT.
#
# 2026-09-27 — CORREÇÕES (o check estava vermelho sem verificar nada):
#   1. CONEXÃO. O runner self-hosted roda no MESMO Swarm do banco, mas `DATABASE_URL`
#      aponta para o IP público e o Postgres só é alcançável pela rede do Swarm —
#      resultado medido: `connect ECONNREFUSED 209.142.67.51:5432`. Agora o check usa a
#      rota que funciona neste repo: `docker exec` no container `supabase_db` (a mesma de
#      scripts/decouple/zapp-drift-check.sh, que roda verde), extraindo "version|name".
#   2. PARSING. `DB_ONLY=$(grep -c A || grep -c B || echo 0)` produzia saída MULTI-LINHA
#      (grep -c imprime "0" e sai com 1 quando não há match), e escrever isso em
#      $GITHUB_OUTPUT quebrava o passo com "Invalid format '0'" — era isso que deixava o
#      check vermelho, não o drift. Agora cada contagem tem uma linha só.
#   3. NAME_MISMATCH passou a aparecer no summary e no comentário (antes era contado só
#      dentro do texto e sumia).
# Efeito: o check continua WARN-ONLY (a política é dos donos do repo), mas passa a
# reportar o drift REAL — que existe e é grande: 688 shadow migrations e 16 nomes
# divergentes convivem com 173 arquivos no repo. Runbook: docs/ops/RUNBOOK-MIGRATION-DRIFT.md

name: Migration Drift Guard

on:
  schedule:
    # Etapa 47: schedule reabilitado após correção de 27/09 (check já reporta drift real).
    # Segunda-feira 07:05 UTC (jitter para não colidir com outros crons das 07:00).
    - cron: '5 7 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**.sql'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**.sql'
  workflow_dispatch:
    inputs:
      fail_on_drift:
        description: 'Falhar (exit 1) se houver drift?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  migration-drift-check:
    name: Drift repo ↔ banco
    runs-on: [Linux, X64, vps-zapp]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Descobrir o container do banco no Swarm
        id: db
        run: |
          CTN=$(docker ps --filter name=supabase_db --format '{{.Names}}' | head -1)
          echo "container=$CTN" >> "$GITHUB_OUTPUT"
          if [ -z "$CTN" ]; then
            echo "::warning title=Drift repo ↔ banco NAO verificado::container supabase_db nao encontrado neste runner — verificacao pulada (a rota TCP do IP publico da ECONNREFUSED)."
          else
            echo "container do banco: $CTN"
          fi

      - name: Extrair migrations do banco (docker exec, mesma rota do zapp-drift-check.sh)
        if: steps.db.outputs.container != ''
        run: |
          echo "SELECT version || '|' || COALESCE(name,'') FROM supabase_migrations.schema_migrations ORDER BY version;" \
            | docker exec -i "${{ steps.db.outputs.container }}" \
                sh -c 'PGPASSWORD=$(cat /run/secrets/supabase_db_password_v1) psql -U supabase_admin -d postgres -At -f -' \
            > db-versions.txt
          echo "migrations extraidas do banco: $(wc -l < db-versions.txt)"
          if [ ! -s db-versions.txt ]; then
            echo "::error::extracao do banco veio vazia"
            exit 1
          fi

      - name: Run drift check
        id: drift
        if: steps.db.outputs.container != ''
        run: |
          set +e
          node scripts/check-migration-version-bank-drift.mjs --db-versions-file db-versions.txt 2>&1 | tee drift-output.txt
          DRIFT_EXIT=${PIPESTATUS[0]}
          set -e

          # grep -c imprime "0" E sai com 1 quando não há match. Encadear com `|| echo 0`
          # devolvia saída multi-linha (ex.: "0\n0"), e escrever isso em $GITHUB_OUTPUT
          # abortava o passo com "Invalid format '0'". Com `| head -1` a substituição tem
          # sempre uma linha e o pipeline sai 0.
          count() { grep -cE "$1" drift-output.txt 2>/dev/null | head -1 || true; }
          DB_ONLY=$(count 'DB_ONLY|\[\?\]')
          REPO_ONLY=$(count 'REPO_ONLY|\[ \]')
          COLLISION=$(count 'PREFIX_COLLISION|\[!\]')
          MISMATCH=$(count 'NAME_MISMATCH|\[≠\]')

          echo "drift_exit=$DRIFT_EXIT"   >> "$GITHUB_OUTPUT"
          echo "db_only=$DB_ONLY"         >> "$GITHUB_OUTPUT"
          echo "repo_only=$REPO_ONLY"     >> "$GITHUB_OUTPUT"
          echo "collision=$COLLISION"     >> "$GITHUB_OUTPUT"
          echo "mismatch=$MISMATCH"       >> "$GITHUB_OUTPUT"

          # Step Summary
          echo "## Migration Drift Guard" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRIFT_EXIT" -eq 0 ]; then
            echo "✅ **Sem drift**: repo e banco em perfeita paridade." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ **Drift detectado** — verifique os detalhes abaixo." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Tipo | Contagem |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------|---------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🗄️ No banco, sem arquivo (shadow) | $DB_ONLY |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 📁 No repo, sem entrada no banco | $REPO_ONLY |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 💥 Colisão de prefixo | $COLLISION |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🏷️ Mesmo version, nome diferente | $MISMATCH |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Saída completa</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            head -100 drift-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi

          # WARN-ONLY: sempre exit 0 (não bloqueia merge)
          # Para modo strict: substituir por "exit $DRIFT_EXIT"
          FAIL_ON_DRIFT="${{ github.event.inputs.fail_on_drift }}"
          if [ "$FAIL_ON_DRIFT" = "true" ] && [ "$DRIFT_EXIT" -ne 0 ]; then
            echo "🚫 fail_on_drift=true — falhando com exit 1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          exit 0

      - name: Comment on PR (drift detected)
        # Etapa 42: deduplicação — atualiza comentário existente em vez de criar novo a cada push.
        if: |
          github.event_name == 'pull_request' &&
          steps.drift.outputs.drift_exit != '0' &&
          steps.drift.outputs.drift_exit != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('drift-output.txt', 'utf8');
            const dbOnly   = '${{ steps.drift.outputs.db_only }}';
            const repoOnly = '${{ steps.drift.outputs.repo_only }}';
            const mismatch = '${{ steps.drift.outputs.mismatch }}';
            const MARKER = '<!-- migration-drift-guard -->';

            const body = `${MARKER}
## ⚠️ Migration Drift Guard — drift detectado

| Tipo | Qtd |
|------|-----|
| 🗄️ No banco, sem arquivo no repo (shadow migration) | **${dbOnly}** |
| 📁 No repo, sem entrada no banco (não aplicada) | **${repoOnly}** |
| 🏷️ Mesmo version com nome diferente | **${mismatch}** |

**Shadow migrations** (DB_ONLY) são o risco principal: foram aplicadas manualmente
sem passar pelo versionamento do repo. Cada uma deve ser materializada em
\`supabase/migrations/<timestamp>_<nome>.sql\` ou documentada como exceção em
\`docs/ops/MIGRATIONS_CLEANUP_DECISIONS.md\`.

<details>
<summary>Saída completa do check</summary>

\`\`\`
${output.slice(0, 4000)}
\`\`\`
</details>

> **Modo atual: WARN-ONLY** — este PR pode ser mergeado, mas o drift deve ser
> resolvido. Runbook: \`docs/ops/RUNBOOK-MIGRATION-DRIFT.md\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Comment on PR (clean)
        # Etapa 42: deduplicação — atualiza comentário existente em vez de criar novo.
        if: |
          github.event_name == 'pull_request' &&
          steps.drift.outputs.drift_exit == '0'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const MARKER = '<!-- migration-drift-guard -->';
            const body = `${MARKER}\n## ✅ Migration Drift Guard\n\nRepo e banco em perfeita paridade — sem shadow migrations.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
