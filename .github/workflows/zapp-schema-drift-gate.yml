name: zapp-schema-drift-gate
# Gate I7 lado zapp: zapp-web-v3 e o dono unico da estrutura do schema zapp.
on:
  schedule:
    - cron: '10 9 * * *'   # 06:10 America/Sao_Paulo (offset do gate evo)
  workflow_dispatch:
    inputs:
      regen:
        description: 'Regenerar snapshot (abre PR com resultado — use apenas quando migration nova foi aplicada)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/decouple/snapshots/**'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Etapa 19: contents:write apenas no job de regen (dispatch com regen=true).
# PR/push ficam com read-only — o token não escreve no repo a não ser quando explicitamente pedido.
permissions:
  contents: read

jobs:
  drift-check:
    runs-on: [Linux, X64, vps-zapp]
    timeout-minutes: 15
    # Etapa 19: write declarado estaticamente (actionlint não aceita expressão em permissions);
    # escrita real só ocorre no step de commit, que tem if: regen == 'true' como guarda.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check drift zapp schema vs snapshot (ou regenera com REGEN=1)
        env:
          REGEN: ${{ github.event.inputs.regen == 'true' && '1' || '0' }}
        run: sh scripts/decouple/zapp-drift-check.sh

      - name: Abrir PR com snapshot regenerado (somente quando REGEN=true)
        if: github.event.inputs.regen == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "ci-bot@atomicabr.com.br"
          git config user.name "CI Bot [zapp-drift-regen]"
          git add scripts/decouple/snapshots/zapp_schema_snapshot.sql
          if git diff --staged --quiet; then
            echo "Snapshot ja estava atualizado — nada a commitar."
          else
            BRANCH="chore/regen-zapp-snapshot-$(date +%Y%m%d-%H%M)"
            git checkout -b "$BRANCH"
            git commit -m "fix(ci): regen zapp schema snapshot [skip ci]"
            git push -u origin "$BRANCH"
            gh pr create \
              --title "fix(ci): regen zapp schema snapshot" \
              --body "Snapshot regenerado automaticamente pelo CI (zapp-schema-drift-gate regen=true).\n\nRevisar e mergear após validação do drift." \
              --base main \
              --head "$BRANCH"
            echo "PR criada para o snapshot regenerado."
          fi
