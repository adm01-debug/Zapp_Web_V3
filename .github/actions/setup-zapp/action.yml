name: setup-zapp
description: |
  Etapa 27 do plano de CI (2026-09-28): setup padronizado de Bun +
  cache de dependências para jobs que rodam em ubuntu-latest.
  Use DEPOIS de actions/checkout (o `uses: ./` só resolve com o
  repo já no disco). Ex.:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-zapp

inputs:
  install-args:
    description: "Argumentos do bun install"
    required: false
    default: "--frozen-lockfile --ignore-scripts"
  skip-install:
    description: "'true' pula o bun install (só runtime + cache)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

    - name: Cache Bun dependencies
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: bun install
      if: inputs.skip-install != 'true'
      shell: bash
      run: bun install ${{ inputs.install-args }}
