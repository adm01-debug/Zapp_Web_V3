version: '3.8'

# supabase-backup v4.2 — CC7 (2026-08-08): sha256 do dump local + decisão _supabase
# v4.2 (2026-08-18): retencao R2 14d (G-B4) — dry-run SEMPRE; rm real SOMENTE
#   com RETENTION_ENABLED=true (OFF em producao). Nada destrutivo por padrao.
# v4 fix A4: tmpfs mount previne volume anonimo acumulado
# A imagem postgres:15-alpine declara VOLUME /var/lib/postgresql/data.
# O container usa apenas psql/pg_dump (sem servidor PG local), portanto
# o volume e desnecessario. tmpfs de 64MB previne acumulo de volumes orfaos.
# Aplicado 2026-08-08 - mesmo padrao fix A4 do evolution-db-purge (stack 126).
# CC7: sha256sum gravado junto ao dump (supabase_selfhosted_*.dump.sha256) —
#      validacao de integridade pos-restore; _supabase (analytics 9.9GB) NÃO
#      incluído no dump (descartável/reconstruível — RPO infinito documentado).

services:
  backup:
    image: postgres:15-alpine@sha256:09e4f20b14ddb3dfe3a0c825b206032aaf8f28300ba2070c0b60fc1c10c6abc7
    networks:
      - atomicabr
    volumes:
      - backup_data:/backups
      - type: tmpfs
        target: /var/lib/postgresql/data
        tmpfs:
          size: 67108864
    secrets:
      - supabase_db_password_v1
      - evolution_r2_access_key_v1
      - evolution_r2_secret_key_v1
      - backup_passphrase_v1
    environment:
      PGHOST: "supabase_db"
      PGPORT: "5432"
      PGUSER: "supabase_admin"
      PGDATABASE: "postgres"
      MIN_SIZE_BYTES: "15728640"
      MIN_TABLES: "400"
      RETENTION_DAYS: "14"
      R2_ENDPOINT: "https://cd0f4eee542191c4957567814e1f8ca1.r2.cloudflarestorage.com"
      R2_BUCKET: "promo-brindes-backups"
      R2_PREFIX: "backups/supabase-db/daily"
      R2_RETENTION: "14d"
      RETENTION_ENABLED: "false"
      BACKUP_MODE: "local+r2"
      ALERT_WEBHOOK_URL: "https://n8n.atomicabr.com.br/webhook/warroom-alert"
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "=== SUPABASE BACKUP v4.2 (CC7 sha256 + retencao R2 14d dry-run) ==="
        export PGPASSWORD=$$(cat /run/secrets/supabase_db_password_v1)
        apk add --no-cache --quiet gnupg curl >/dev/null 2>&1 || true
        if ! command -v mc >/dev/null 2>&1; then
          wget -q -O /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc && chmod +x /usr/local/bin/mc || true
        fi
        MC_BIN=$$(command -v mc || true)

        alert() {
          _ST="$$1"; _MSG="$$2"
          _TS=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
          case "$$_ST" in P1_*) _AT="critical" ;; *) _AT="warning" ;; esac
          echo "[ALERT $$_ST] $$_MSG"
          curl -s --max-time 10 -X POST "$$ALERT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"supabase-backup\",\"entity\":\"supabase-backup\",\"alert_type\":\"$$_AT\",\"title\":\"supabase-backup $$_ST\",\"message\":\"$$_MSG\",\"ts\":\"$$_TS\"}" \
            >/dev/null 2>&1 || true
        }
        while true; do
          STAMP=$$(date +%Y%m%d_%H%M%S); FILE="supabase_selfhosted_$${STAMP}.dump"
          if ! pg_dump --no-owner --no-acl --format=custom --compress=6 --file=/backups/$${FILE} 2>/dev/null; then
            touch /backups/BACKUP_FAILED_$${STAMP}
            rm -f /backups/$${FILE}
            alert "P1_CRITICAL" "supabase-backup: pg_dump falhou ($$STAMP)"
            sleep 3600; continue
          fi
          SIZE_BYTES=$$(stat -c%s /backups/$${FILE} 2>/dev/null || echo 0)
          TABLE_COUNT=$$(pg_restore --list /backups/$${FILE} 2>/dev/null | grep -c 'TABLE DATA' || echo 0)
          if [ "$$SIZE_BYTES" -lt "$$MIN_SIZE_BYTES" ] || [ "$$TABLE_COUNT" -lt "$$MIN_TABLES" ]; then
            echo "[$$STAMP] FAIL: size=$$SIZE_BYTES tables=$$TABLE_COUNT"
            mv /backups/$$FILE /backups/REJECTED_$$FILE
            alert "P1_CRITICAL" "supabase-backup: dump rejeitado size=$$SIZE_BYTES tables=$$TABLE_COUNT"
            sleep 3600; continue
          fi
          echo "[$$STAMP] OK: $$((SIZE_BYTES/1048576))MB $$TABLE_COUNT tables"
          # CC7: integridade local (arquivo .sha256 ao lado do dump)
          sha256sum /backups/$${FILE} > /backups/$${FILE}.sha256 2>/dev/null \
            && echo "[$$STAMP] sha256 gravado: $$(cat /backups/$${FILE}.sha256 | cut -c1-12)..." \
            || echo "[$$STAMP] WARN: sha256 falhou (continua sem hash)"
          OFFSITE_OK=false
          if [ -n "$$MC_BIN" ] && command -v gpg >/dev/null 2>&1; then
            if gpg --batch --yes --symmetric --cipher-algo AES256 \
                 --passphrase-file /run/secrets/backup_passphrase_v1 \
                 -o /backups/$${FILE}.gpg /backups/$${FILE} 2>/dev/null \
               && $$MC_BIN alias set r2 "$$R2_ENDPOINT" "$$(cat /run/secrets/evolution_r2_access_key_v1)" "$$(cat /run/secrets/evolution_r2_secret_key_v1)" >/dev/null 2>&1 \
               && $$MC_BIN cp -q /backups/$${FILE}.gpg r2/$$R2_BUCKET/$$R2_PREFIX/ 2>/dev/null; then
              echo "[$$STAMP] R2 OK"
              OFFSITE_OK=true
            else
              touch /backups/OFFSITE_FAILED_$$STAMP
              alert "P2_WARNING" "supabase-backup: upload R2 falhou ($$STAMP)"
            fi
            rm -f /backups/$${FILE}.gpg
          fi
          psql -tAc "SELECT ops.fn_update_backup_sentinel('$$FILE', $$SIZE_BYTES, $$TABLE_COUNT, $${OFFSITE_OK})" 2>/dev/null \
            || echo "[$$STAMP] WARN: sentinel sync falhou (psql/sql)"
          find /backups -name "supabase_selfhosted_*.dump*" -mtime +$$RETENTION_DAYS -delete 2>/dev/null
          # ---- retencao R2 14d (G-B4): dry-run SEMPRE; rm real SOMENTE com RETENTION_ENABLED=true ----
          if [ -n "$$MC_BIN" ]; then
            RET_D="$${R2_RETENTION:-14d}"
            echo "[$$STAMP] [retencao] dry-run R2 $${RET_D}:"
            $$MC_BIN alias set r2 "$$R2_ENDPOINT" "$$(cat /run/secrets/evolution_r2_access_key_v1)" "$$(cat /run/secrets/evolution_r2_secret_key_v1)" >/dev/null 2>&1 || true
            $$MC_BIN rm --recursive --older-than "$$RET_D" --dry-run --force "r2/$$R2_BUCKET/$$R2_PREFIX/" 2>&1 | sed 's/^/  /' || true
            if [ "$${RETENTION_ENABLED:-false}" = "true" ]; then
              echo "[$$STAMP] [retencao] RETENTION_ENABLED=true - aplicando rm $${RET_D}"
              $$MC_BIN rm --recursive --older-than "$$RET_D" --force "r2/$$R2_BUCKET/$$R2_PREFIX/" \
                && echo "[$$STAMP] [retencao] rm aplicado" \
                || alert "P2_WARNING" "supabase-backup: rm retencao R2 falhou"
            else
              echo "[$$STAMP] [retencao] RETENTION_ENABLED=false - nada removido (dry-run)"
            fi
          fi
          sleep 86400
        done
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 60s
      resources:
        limits:
          memory: 1G
      labels:
        - com.atomicabr.audit=supabase-backup-v4.2-retencao-r2-14d-dryrun-2026-08-18|v4.1-cc7-sha256-2026-08-08|AG-EX-17-sentinel-offsite-flag-2026-08-06|fix-A4-tmpfs-2026-08-08|C3-retencao-glob-sufixos-2026-08-15|C4-alert-webhook-2026-08-15|C5-payload-n8n-schema-2026-08-15
        - com.atomicabr.tier=critical
        - com.atomicabr.fix=cc7-sha256-integridade-2026-08-08

  dump-alert:
    image: postgres:15-alpine@sha256:09e4f20b14ddb3dfe3a0c825b206032aaf8f28300ba2070c0b60fc1c10c6abc7
    networks:
      - atomicabr
    volumes:
      - alert_state:/state
      - type: tmpfs
        target: /var/lib/postgresql/data
        tmpfs:
          size: 67108864
    secrets:
      - supabase_db_password_v1
      - evolution_r2_access_key_v1
      - evolution_r2_secret_key_v1
    environment:
      PGHOST: "supabase_db"
      PGPORT: "5432"
      PGUSER: "supabase_admin"
      PGDATABASE: "postgres"
      R2_ENDPOINT: "https://cd0f4eee542191c4957567814e1f8ca1.r2.cloudflarestorage.com"
      R2_BUCKET: "promo-brindes-backups"
      MAX_AGE_HOURS: "26"
      ALERT_WEBHOOK_URL: "https://n8n.atomicabr.com.br/webhook/warroom-alert"
    entrypoint: ["sh", "-c"]
    command:
      # script espelho versionado em scripts/alert-missing-dumps.sh (base64)
      - |
        echo "=== DUMP ALERT v1 (PLANO-100 2026-08-24) ==="
        apk add --no-cache --quiet curl >/dev/null 2>&1 || true
        if ! command -v mc >/dev/null 2>&1; then
          wget -q -O /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc && chmod +x /usr/local/bin/mc || true
        fi
        MC_BIN=$$(command -v mc || true)
        $$MC_BIN alias set r2 "$$R2_ENDPOINT" "$$(cat /run/secrets/evolution_r2_access_key_v1)" "$$(cat /run/secrets/evolution_r2_secret_key_v1)" >/dev/null 2>&1 || true
        echo "" | base64 -d > /dump-alert.sh
        chmod +x /dump-alert.sh
        while true; do
          STATE_DIR=/state sh /dump-alert.sh || echo "[dump-alert] check reportou problema"
          sleep 86400
        done
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 120s
      resources:
        limits:
          memory: 256M
      labels:
        - com.atomicabr.audit=dump-alert-v1-2026-08-24
        - com.atomicabr.tier=critical

volumes:
  backup_data:
    driver: local
  alert_state:
    driver: local

networks:
  atomicabr:
    external: true
    name: AtomicaBRNet

secrets:
  supabase_db_password_v1:
    external: true
  evolution_r2_access_key_v1:
    external: true
  evolution_r2_secret_key_v1:
    external: true
  backup_passphrase_v1:
    external: true
