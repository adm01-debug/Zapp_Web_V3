version: "3.8"
services:
  web:
    image: ${ZAPP_IMAGE}
    networks:
      - AtomicaBRNet
      - zapp-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - "traefik.http.routers.zapp-prod.rule=Host(`zapp.atomicabr.com.br`)"
        - traefik.http.services.zapp-prod.loadbalancer.server.port=80
        - traefik.http.routers.zapp-prod.service=zapp-prod
        - traefik.http.routers.zapp-prod.entrypoints=websecure
        - traefik.http.routers.zapp-prod.tls.certresolver=letsencryptresolver
        - traefik.http.routers.zapp-prod.tls=true
        # Router secundario zappweb.app.br (OC-07, 2026-08-07)
        - "traefik.http.routers.zappweb.rule=Host(`zappweb.app.br`)"
        - traefik.http.services.zappweb.loadbalancer.server.port=80
        - traefik.http.routers.zappweb.service=zappweb
        - traefik.http.routers.zappweb.entrypoints=websecure
        - traefik.http.routers.zappweb.tls.certresolver=letsencryptresolver
        - traefik.http.routers.zappweb.tls=true
        # Router www.zappweb.app.br (deploy-fix 2026-08-20)
        - "traefik.http.routers.zappweb-www.rule=Host(`www.zappweb.app.br`)"
        - traefik.http.services.zappweb-www.loadbalancer.server.port=80
        - traefik.http.routers.zappweb-www.service=zappweb-www
        - traefik.http.routers.zappweb-www.entrypoints=websecure
        - traefik.http.routers.zappweb-www.tls.certresolver=letsencryptresolver
        - traefik.http.routers.zappweb-www.tls=true
        - traefik.http.routers.zappweb-www.middlewares=crowdsec-bouncer@docker
        - com.centurylinklabs.watchtower.enable=false
        - traefik.http.routers.zapp-prod.middlewares=crowdsec-bouncer@docker
        - traefik.http.routers.zappweb.middlewares=crowdsec-bouncer@docker
        - com.atomicabr.tier=critical
      update_config:
        failure_action: rollback
        monitor: 60s
        order: start-first
      rollback_config:
        order: start-first
        monitor: 60s
        failure_action: continue
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
networks:
  AtomicaBRNet:
    external: true
    name: AtomicaBRNet
  zapp-net:
    external: true
    name: zapp-net
